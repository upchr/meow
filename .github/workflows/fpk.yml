# fpk 链路（fnOS 原生应用包）。
#
# ═══════════════════════════════════════════════════════════════════════
# 触发入口
# ═══════════════════════════════════════════════════════════════════════
#
#   git tag fpk-v1.0.8        → 构建 x86 + arm，建本 tag 的 **draft** Release
#   Actions 页面 Run workflow   → 只出 artifacts（手动验证，不建 Release、不写索引）
#   release.yml 全量调用        → 构建 x86 + arm，产物由主 Release 托管
#   Release Publish（人工）      → index-after-publish 写两条索引
#
# ★ 前缀后面必须紧跟数字（与 release.yml 同一套 glob 规则）：
#   `fpk-verify-1.0.8` 这类名字**不会触发**。
# ★ **不监听 push 到 main**：fpk 只在发版/补包时构建，日常提交不烧额度。
# ★ **两条索引通道**（与 TV/PC 的 packages.json 同一形态），**都只在 Publish 之后写**：
#   · FnDepot `fnpack.json`：飞牛应用中心正式源，**只存索引与图标**，
#     download_url 是主仓 Release 绝对直链（2026-11-27 起，包体不再入库）
#   · `fpk-updates` 分支的 `fpk.json`：主仓镜像索引，download_url 指向本次 Release 的资产，
#     **合并写入**而不是覆盖（补发旧版本不顶掉新版本）
#   release.yml 的 sync-packages 会跳过 fpk-v*，不会误生成 packages.json。
#
# ★ 2026-11-13 对齐 TV/PC（用户口径「对齐」）：索引从**构建时**挪到**发布后**。
#   以前 fpk 是唯一「draft 还没 Publish 就把索引/包体推给用户」的链，和
#   「draft 不产生任何用户可见清单」这条规则冲突；现在四条链完全同构：
#     tag → 构建 → draft Release → 人工 Publish → 写索引/清单。
#
# ═══════════════════════════════════════════════════════════════════════
# 为什么和 release.yml 分开
# ═══════════════════════════════════════════════════════════════════════
#
# 1. fpk 依赖系统 java-21-openjdk / 网络下载 fnpack，构建口径与三端安装包不同；
# 2. 但**全量发版也必须带 fpk**（2026-11-13 用户报「release tag 触发的全量发布
#    没有 fpk、FnDepot 也没更新」）—— release.yml 以 workflow_call 调本文件，
#    只是仍保留 fpk-v* 单链补包的能力（补包时不用重跑 Docker/TV/PC）。
#
# ═══════════════════════════════════════════════════════════════════════
# 产物
# ═══════════════════════════════════════════════════════════════════════
#
#   meow_<version>_x86.fpk   platform=x86  （meowd: x86_64 musl static-pie）
#   meow_<version>_arm.fpk   platform=arm  （meowd: aarch64 musl static）
#
# 命名里带架构：官方 manifest 的 `all` 只允许「包内不含架构相关二进制」，
# 我们的 bin/meowd 是 ELF，必须按架构分包（见 docs 的 manifest 原文）。
#
# ═══════════════════════════════════════════════════════════════════════
# 回写 FnDepot 应用源（只有 Release 被 Publish 之后才做）
# ═══════════════════════════════════════════════════════════════════════
#
# `release: published` 触发 index-after-publish：它从**已发布的 Release** 里下载
# meow_*.fpk（两个架构都必须在），校验 sha256 后把 **fnpack.json** 提交到
# upchr/FnDepot（V2 索引，download_url 写该 Release 的绝对直链），同时合并写
# `fpk-updates` 分支的镜像索引。★ 2026-11-27 起 FnDepot 不再接收包体。
#
# ★ 为什么不再在构建时写：draft 是「还没发出去」的草稿。以前 fpk 在 draft 阶段就
#   推 FnDepot，用户能装到一个官方还没 Publish 的版本；点 Publish 之前没法撤回。
#   现在 publish-draft 只建草稿，索引一律等 Publish（与 sync-packages 同语义）。
# ★ 跨仓推送用 secrets.FNDEPOT_TOKEN：GITHUB_TOKEN 只能写本仓库。
# ★ 只改 apps.meow.releases[<version>] 这一棵子树，其余节点原样保留。
# ★ 双架构是硬条件：只有 x86 的索引比不出索引更糟（arm 用户会以为源坏了）。

name: fpk

on:
  push:
    tags:
      - 'fpk-v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空取 client/package.json）'
        required: false
        type: string
      tag:
        description: '只重跑索引：已发布 Release 的 tag（如 release-v1.2.5）；填了就跳过构建'
        required: false
        type: string
      replace:
        description: '允许同版本覆盖（默认禁止：同版本重打包 = 旧索引指向新文件，会让人撞 size/sha 校验失败）'
        required: false
        type: boolean
        default: false
      keep:
        description: 'FnDepot 保留最近几个版本（默认 5；清理发生在写索引之后）'
        required: false
        type: string
        default: '5'
  # ★ 索引只在「Release 被 Publish」之后写（2026-11-13 与 sync-packages 对齐）。
  #   全量 release-v<ver> 与单链 fpk-v<ver> 都走这一条；draft 阶段不产生任何
  #   用户可见的索引，Publish 之前随时可以删掉草稿。
  release:
    types: [published]
  # ★ 被 release.yml 调用（2026-11-13 用户报「全量 tag 发版没有 fpk、FnDepot 也没更新」）：
  #   全量发版必须把 fnOS 包一起出，否则每次都要手动补推一个 fpk-v* tag。
  #   mirror_tag 是主仓镜像 Release 的 tag 名 —— 调用方传 `fpk-v<版本>`，
  #   不能落回 github.ref_name（那会是 release-v<版本>，把主 Release 改成
  #   prerelease 并覆盖正文，2026-11-13 复核过这个坑）。
  workflow_call:
    inputs:
      version:
        description: '版本号（留空取 client/package.json）'
        required: false
        type: string
      mirror_tag:
        description: '主仓镜像 Release 的 tag（默认用触发 ref 的 tag 名）'
        required: false
        type: string
      keep:
        description: 'FnDepot 保留最近几个版本（默认 5）'
        required: false
        type: string
    secrets:
      FNDEPOT_TOKEN:
        required: false

# 主仓镜像需要创建 Release 并推 fpk-updates 分支
permissions:
  contents: write

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: 版本与范围
    # release 事件只跑索引（index-after-publish），不重建包；
    # dispatch 带 tag 时同理：只补索引，不重新构建。
    if: github.event_name != 'release' && inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      mirror_tag: ${{ steps.v.outputs.mirror_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        id: v
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(node -p "require('./client/package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"
          # 主仓镜像 tag：调用方显式给（release.yml 传 fpk-v<版本>），
          # 否则用触发 ref（fpk-v* tag 或 workflow_dispatch 的分支名，后者不发布）
          M="${{ inputs.mirror_tag }}"
          if [ -z "$M" ]; then M="${GITHUB_REF#refs/tags/}"; fi
          echo "mirror_tag=$M" >> "$GITHUB_OUTPUT"
          echo "镜像 tag：$M"

      # 13 处版本号的一致性校验（含 TV versionCode 与 compose 兜底）
      - name: 版本一致性
        shell: pwsh
        run: ./deploy/scripts/bump-version.ps1 -Check

      # ★ fpk manifest 不在 bump-version.ps1 的 13 处里。
      #   构建时 build-fpk.sh 会用 VERSION 覆盖它，产物永远是对的；
      #   这里只拦「仓库里的 manifest 已经漂了」：要么手动改，要么把 fpk
      #   也加进 bump 脚本（那会把文档里的 13 变成 14，所以暂不这么做）。
      - name: fpk manifest 版本
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          M=$(grep -E '^version[[:space:]]*=' client/apps/fnos/fpk/manifest \
              | head -1 | sed 's/^[^=]*=[[:space:]]*//' | tr -d '[:space:]')
          if [ "$M" != "$V" ]; then
            echo "::error::client/apps/fnos/fpk/manifest 的 version=$M，与 client/package.json 的 $V 不一致"
            echo "改 manifest 里那一行，或改用 tag 触发的 workflow_dispatch 并手动同步。"
            exit 1
          fi
          echo "OK: manifest version=$M"

      # tag 名只是入口，版本号以 package.json 为准；但 fpk-v<数字> 与版本号
      # 不一致时产物名会与 tag 对不上，先拦住（release.yml 对前缀 tag 不比对，
      # 这里对 fpk 单独加严）。
      # ★ 只在**真的推了 fpk-v* tag** 时校验：被 release.yml 调用时
      #   github.ref_name 是 release-v<版本>，比了必错（2026-11-13 踩点）。
      - name: tag 与版本号一致
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fpk-v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.v.outputs.version }}"
          if [ "fpk-v$VER" != "$TAG" ]; then
            echo "::error::tag=$TAG 与版本号 fpk-v$VER 不一致（产物会叫 meow_${VER}_*.fpk）"
            exit 1
          fi
          echo "OK: $TAG"

  build:
    name: fpk ${{ matrix.platform }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            # `file` 的输出里必须出现这串，防止把 arm 产物打进 x86 包
            elf_marker: 'x86-64'
          - platform: arm
            elf_marker: 'ARM aarch64'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 与 manifest 的 install_dep_apps=java-21-openjdk 对齐；
          # javac 21 产出的 class 版本 (65) 在 java-21 上直接可跑。
          java-version: '21'

      # ── 复用全量链产出的 fpk 版 dist（2026-11-13）──────────────────────
      # 只有被 release.yml 在 release-v* 上调用时才探测：单链 fpk-v* / dispatch
      # 根本没有这个 artifact，探测只会多出一条"下载失败"的红叉噪音。
      # 注意顺序：探测放在 pnpm/node 之前 —— 复用成功时这两步也要一起跳过。
      - name: 尝试复用 web job 的 fpk 版 dist
        id: distdl
        if: ${{ startsWith(github.ref, 'refs/tags/release-v') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-dist-fpk
          path: client/apps/web/dist

      # 判据是**内容**不是"文件在不在"：index.html 里必须真带 /app/meow/ 前缀，
      # 否则宁可直接自建 —— 复用到一份 base 错的产物等于端上白屏。
      - name: 校验复用产物（不可用就让下一步自建）
        id: distok
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          if [ -f client/apps/web/dist/index.html ] \
             && grep -q '/app/meow/' client/apps/web/dist/index.html; then ok=1; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = "1" ]; then
            echo "复用 web-dist-fpk（跳过 node/pnpm/install/typecheck/vite）"
          else
            echo "没有可复用的 dist → 自行构建"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.distok.outputs.ok != '1'
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        if: steps.distok.outputs.ok != '1'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: 前端构建（没有可复用产物时才跑：单链 fpk-v* / dispatch / 全量回退）
        if: steps.distok.outputs.ok != '1'
        working-directory: client
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @meow/web typecheck
          # fnOS 微应用挂在 /app/meow 下：base 必须与 ui/config 的 gatewayPrefix 一致，
          # 否则 assets / 接口会请求到站点根。其它构建目标（web/docker/desktop/tv）不受影响。
          VITE_API_BASE=/app/meow pnpm --filter @meow/web exec vite build --base=/app/meow/
          test -f apps/web/dist/index.html
          grep -q '/app/meow/' apps/web/dist/index.html

      # fnpack 官方二进制（Linux x86）。地址来自官方文档：
      #   https://developer.fnnas.com/docs/cli/fnpack
      # 拿不到时 build-fpk.sh 会退化成 tar 手工打包（结构已核对，但未经安装验证），
      # 所以这里只警告、不中断；日志里出现 ::warning:: 就要当心。
      # 外网固定版本文件 → 进 actions/cache：两腿各拉一次变成整轮一次。
      - name: 缓存 fnpack
        uses: actions/cache@v4
        with:
          path: ~/.cache/meow/fnpack-1.2.3
          key: fnpack-1.2.3-linux-amd64
      - name: 安装 fnpack
        shell: bash
        run: |
          set -euo pipefail
          BIN="$HOME/.cache/meow/fnpack-1.2.3"
          mkdir -p "$(dirname "$BIN")" "$RUNNER_TEMP/bin"
          if [ ! -x "$BIN" ]; then
            URL="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
            if curl -fsSL --retry 3 --connect-timeout 20 "$URL" -o "$BIN"; then
              chmod +x "$BIN"
            else
              rm -f "$BIN"
            fi
          fi
          if [ -x "$BIN" ]; then
            ln -sf "$BIN" "$RUNNER_TEMP/bin/fnpack"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/bin/fnpack" --version || true
          else
            echo "::warning::fnpack 下载失败，将走 tar 兜底打包（建议重跑）"
          fi

      # ★ 自建 jar，不复制现成产物。
      #   2026-11-06 踩过：复制 server/build/ 下 11-03 的旧 jar，health 报 1.0.5。
      #   build-fpk.sh 默认就会跑这个脚本。
      # ★ 复用已构建产物：同 commit 重跑、或两腿里后跑的那条腿直接命中。
      #   · apiserver.jar 按源码指纹缓存。版本已改为运行时读 VERSION 文件（不再进源码），
      #     所以源码没变就能跨版本复用，且不会把"旧版本号"带进新包：版本文件由
      #     build-fpk.sh 每次从 manifest 重新写，包内断言会校验它。
      #   · dex2jar 目录按 fetch 脚本指纹缓存：省掉每次 20MB 下载（裁剪白名单也在那个脚本里，
      #     白名单一变 key 就变，不会用到旧的全量包）。
      - name: 缓存 apiserver.jar 与 dex2jar
        id: buildcache
        uses: actions/cache@v4
        with:
          path: |
            server/build/plugins/apiserver/apiserver.jar
            server/tools/dex2jar
          key: jar-d2j-${{ hashFiles('server/host/src/**','server/host/libs/**','server/build-plugin-linux.sh','deploy/scripts/fetch-dex2jar.sh') }}

      - name: 构建 apiserver.jar（源码编译）
        if: steps.buildcache.outputs.cache-hit != 'true'
        run: bash server/build-plugin-linux.sh

      # meowd 的 cargo 编译是单腿最大开销（实测 x86 78s、arm 83~102s，占整条
      # fpk 链一半以上）。缓存 CARGO_HOME（crates 索引与包）与 target（增量产物）：
      # 第二次起只重编改动的 crate。
      # ★ key 不能用 hashFiles(Cargo.lock)：Cargo.lock 里 `name = "meowd"` 那条的 version
      #   以前跟着发版走，会让**每一版都 miss 并存一份 ~79MB 的新缓存**（2026-11-16 实测
      #   累积 14 条 / 1.08GB，会挤掉 PC / 插件的缓存）。这里先把它归一化再 hash。
      - name: 计算 cargo 缓存指纹（剔除本包版本号）
        id: lockfp
        shell: bash
        run: |
          set -euo pipefail
          FP="$(awk '
            /^name = "meowd"$/ { inmeowd = 1; print; next }
            inmeowd && /^version = / { print "version = \"0.0.0\""; inmeowd = 0; next }
            { print }
          ' client/apps/fnos/meowd/Cargo.lock | sha256sum | cut -c1-40)"
          echo "fp=$FP" >> "$GITHUB_OUTPUT"
          echo "cargo-lock 指纹: $FP"

      - name: 缓存 cargo 依赖与增量产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/meow/cargo-home
            ~/.cache/meow/cargo-target-${{ matrix.platform }}
          key: cargo-${{ matrix.platform }}-${{ steps.lockfp.outputs.fp }}
          restore-keys: |
            cargo-${{ matrix.platform }}-

      # ★ SRC/OUT 必须和下面「组包」step 用同一组值：build-arm.sh 产出的
      #   <OUT>/meowd-aarch64 是 build-fpk.sh 在 arm 分支的唯一输入。
      #   2026-11-06 踩过：这里只传了 IMG，脚本回落到 /tmp/meow-src，
      #   docker 挂到空目录 → could not find Cargo.toml → exit 101。
      - name: 交叉编译 aarch64 meowd
        if: matrix.platform == 'arm'
        env:
          SRC: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/out-${{ matrix.platform }}
          IMG: docker.io/library/rust:1-alpine
        run: |
          # 把 cargo 缓存目录传给脚本（不传则保持"编在 /out 里、一次性"的原行为）
          export CARGO_HOME_CACHE="$HOME/.cache/meow/cargo-home"
          export CARGO_TARGET_CACHE="$HOME/.cache/meow/cargo-target-${{ matrix.platform }}"
          bash client/apps/fnos/build-arm.sh

      # ── 运行时插件载荷（drpy / pyrt）──────────────────────────────
      # ★ 1.2.22 / 1.2.24 的 fpk 包里只有 danmu-api：build-fpk.sh 的复制逻辑
      #   一直在，但 CI **从来没构建过**这两个载荷目录 → 每版都落进"缺目录"告警
      #   分支 → 装到 NAS 上 .js/.py 源全哑（depot 探测报 runtime:"down"）。
      #   这里补上，且必须排在「组包」之前。
      - name: 构建运行时插件载荷
        shell: bash
        env:
          FPK_ARCH: ${{ matrix.platform == 'arm' && 'aarch64' || 'x86_64' }}
        run: |
          set -euo pipefail
          # drpy：纯 JS（server.js/worker.js/host.js + node_modules），跨平台
          pwsh -NoProfile -File server/build-plugin-drpy.ps1
          # pyrt：按目标架构打（vendor 里的 pycryptodome 是架构相关的 .so/.pyd）
          bash server/build-plugin-pyrt-linux.sh "$FPK_ARCH"
          du -sh server/build/plugins/drpy "server/build/plugins/pyrt-$FPK_ARCH"

      - name: 组包
        env:
          SRC: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/out-${{ matrix.platform }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.plan.outputs.version }}
          # apiserver.jar 命中缓存时复用（版本在包内 VERSION 文件里，jar 与版本无关）
          SKIP_JAR_BUILD: ${{ steps.buildcache.outputs.cache-hit == 'true' && '1' || '0' }}
          # CI 直连 Docker Hub；daocloud 镜像站只在 NAS 上有意义
          RUST_IMAGE: docker.io/library/rust:1-alpine
        run: |
          # x86 腿的 meowd 是在 build-fpk.sh 里编的（arm 腿在上一 step 已编好）。
          # 传缓存目录让它走增量；不传时脚本行为与原来一致。
          export CARGO_HOME_CACHE="$HOME/.cache/meow/cargo-home"
          export CARGO_TARGET_CACHE="$HOME/.cache/meow/cargo-target-${{ matrix.platform }}"
          bash client/apps/fnos/build-fpk.sh

      # 二次门禁：脚本里的静态校验之外，这里再断一次 ELF 架构与 jar 新鲜度。
      # 这些失败都会导致「装上了、起不来」或「能跑但版本是旧的」。
      - name: 静态校验
        shell: bash
        env:
          OUT: ${{ runner.temp }}/out-${{ matrix.platform }}
          PLATFORM: ${{ matrix.platform }}
          ELF_MARKER: ${{ matrix.elf_marker }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          FPK="$OUT/meow_${VERSION}_${PLATFORM}.fpk"
          test -f "$FPK"
          U="$OUT/verify"
          rm -rf "$U"; mkdir -p "$U/app"
          tar -xzf "$FPK" -C "$U" manifest app.tgz
          tar -xzf "$U/app.tgz" -C "$U/app"

          # 1) 架构标签与二进制必须对上（写错 arch 会让用户装错包）
          grep -qE "^platform[[:space:]]*=[[:space:]]*${PLATFORM}" "$U/manifest"
          file "$U/app/bin/meowd" | tee /dev/stderr | grep -q "$ELF_MARKER"

          # 2) 载荷齐全：漏 web 是白屏，漏 jar 是后端起不来
          test -s "$U/app/web/index.html"
          test -s "$U/app/seed/apiserver/apiserver.jar"
          # 公开壳可以没有 spider.jar；私有全量构建才要求它
          if [ -f "$U/app/seed/apiserver/spider.jar" ]; then
            test -s "$U/app/seed/apiserver/spider.jar"
          fi

          # 3) jar 必须是本次源码编译出来的那一份（同一个 md5）；
          #    版本改由包内 VERSION 文件承载（ApiServer 运行时读），这里断言它
          #    与本次版本一致 —— 双保险防旧产物。
          md5sum "$U/app/seed/apiserver/apiserver.jar" \
                 server/build/plugins/apiserver/apiserver.jar | tee /dev/stderr
          test "$(md5sum "$U/app/seed/apiserver/apiserver.jar" | cut -d' ' -f1)" \
               = "$(md5sum server/build/plugins/apiserver/apiserver.jar | cut -d' ' -f1)"
          test -s "$U/app/seed/apiserver/VERSION"
          test "$(tr -d '[:space:]' < "$U/app/seed/apiserver/VERSION")" = "$VERSION"

          # 4) 依赖与入口：manifest 漏了 java 运行时 → 干净 NAS 上 meowd 起不来；
          #    外层缺 cmd/ → 应用中心点不亮图标（装得上但起不来）
          grep -qE '^install_dep_apps[[:space:]]*=.*java-21-openjdk' "$U/manifest"
          # ★ 清单先落盘再匹配：`tar -tzf | grep -q` 在 pipefail 下会因 grep
          #   命中即退触发 SIGPIPE，tar 报 write error 整步失败（2026-11-06 踩过，
          #   GNU tar 是 exit 2、bsdtar 是 141）。不要用 `|| true` 抹掉门禁。
          tar -tzf "$FPK" > "$U/list.txt"
          grep -q '^cmd/' "$U/list.txt"

          # 5) 包体下限（漏打载荷时通常只剩几 MB）
          test "$(stat -c%s "$FPK")" -gt 10000000

          # 同一个道理：`sort | head` 也会让 sort 挨 SIGPIPE（清单 > 管道缓冲时）
          sort "$U/list.txt" > "$U/list.sorted.txt"
          head -30 "$U/list.sorted.txt"
          # ★ .sha256 只记文件名，不记绝对路径：CI 里 $FPK 是
          #   /home/runner/work/_temp/out-xxx/... ，到发布后索引那一步已经是另一个
          #   目录（data 从 Release 下载回来的），按绝对路径记录的 .sha256 既做不了
          #   `sha256sum -c`，也过不了「$F 必须等于 basename」的断言（2026-11-06 踩过）。
          # ★ --text 是必需的，不是可选：Git bash/MSYS 的 sha256sum 默认 binary
          #   模式，第二列写成 `*文件名`，索引步骤的 `$2 = basename` 会失败。
          #   `--text` 让 MSYS 与 Linux 都产出 `hash<两空格>文件名`（实测 coreutils 8.32）。
          ( cd "$OUT" && sha256sum --text "$(basename "$FPK")" > "$(basename "$FPK").sha256" )
          cat "$FPK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/out-${{ matrix.platform }}/*.fpk
            ${{ runner.temp }}/out-${{ matrix.platform }}/*.fpk.sha256
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------- 单链草稿
  #
  # 只有单链 fpk-v<ver> 走到这里：建本 tag 的 **draft** Release 托管两个 fpk。
  # 全量 release-v<ver> 不走（包由 release.yml 的 publish 收进主 Release）。
  #
  # ★ 2026-11-13 对齐 TV/PC：`prerelease: true` → `draft: true`。以前打完 tag
  #   立刻冒出一个「用户能看见、能下载」的 prerelease，索引同时被推走 —— 等于
  #   跳过了 Publish 这一步；现在和 tv-v* / pc-v* 完全一样：Publish 之前谁都拿不到。
  publish-draft:
    name: 建 draft Release（单链）
    needs: [plan, build]
    if: >-
      github.event_name == 'push' && startsWith(github.ref_name, 'fpk-v')
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 下载 x86 产物
        uses: actions/download-artifact@v4
        with:
          name: fpk-x86
          path: artifacts/x86

      - name: 下载 arm 产物
        uses: actions/download-artifact@v4
        with:
          name: fpk-arm
          path: artifacts/arm

      # 草稿里必须双架构齐全：Publish 之后索引才读这两个文件，
      # 到那时才发现缺一个就晚了（用户已经能看到 Release）。
      - name: 校验产物齐全
        shell: bash
        env:
          VER: ${{ needs.plan.outputs.version }}
          ART: ${{ github.workspace }}/artifacts
        run: |
          set -euo pipefail
          for arch in x86 arm; do
            FPK="$ART/$arch/meow_${VER}_${arch}.fpk"
            SHAF="$FPK.sha256"
            [ -s "$FPK" ] || { echo "::error::缺少 $FPK"; exit 1; }
            [ -s "$SHAF" ] || { echo "::error::缺少 $SHAF"; exit 1; }
            echo "$arch: $(stat -c%s "$FPK") bytes  $(awk '{print $1}' "$SHAF")"
          done

      - name: 挂 draft Release
        # ★ 重跑已发布过的 tag 会把它改回 draft（action 按给定字段更新）——
        #   这是刻意的：重新出包后必须再点一次 Publish，索引才会按新 sha256 重写。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.mirror_tag }}
          name: ${{ needs.plan.outputs.mirror_tag }}
          draft: true
          generate_release_notes: false
          files: |
            artifacts/x86/*.fpk
            artifacts/arm/*.fpk
          body: |
            ## fnOS fpk ${{ needs.plan.outputs.version }}

            这是单链补包的主仓镜像。**点 Publish 之后**，本 workflow 会把 FnDepot 的
            `fnpack.json` 与 `fpk-updates` 分支的 `fpk.json` 一起更新；草稿阶段两条
            索引都不动（用户拿不到未发布的包）。

            FnDepot 仍是飞牛第三方源的正式通道；客户端在 FnDepot 不可达或索引没有
            更高版本时改用本页资产。

  # ---------------------------------------------------------------- 发布后索引
  #
  # `release: published` 触发（draft 被人工 Publish 之后）。这是 fpk **唯一**的
  # 索引写入点：FnDepot 与 fpk-updates 都在这里写，与 release.yml 的 sync-packages
  # 完全同构 —— tag → 构建 → draft Release → 人工 Publish → 写索引/清单。
  #
  # ★ 数据来源是**已发布的 Release 资产**（gh release download），不是本 run 的
  #   artifact：全量链的 fpk 由 release.yml 那个 run 构建，单链也一样；顺带再
  #   校验一次「用户真正下载到的东西」的 sha256 与体积。
  # ★ 写失败一律 `::error::索引未更新`：PAT 过期、远端冲突这类问题必须在日志里
  #   一眼可见，不能静默过去（静默 = 用户以为发了新版，1.2.2 就踩过）。
  index-after-publish:
    name: 发布后写索引
    # ★ prerelease 也算 published 事件：不加这条，把一个草稿标成 prerelease 就会
    #   立刻写走两份索引（等于绕过 Publish 闸门）。
    # ★ dispatch 带 tag 时只补索引（1.2.5 就是这么漏掉主仓镜像的）。
    if: >-
      (github.event_name == 'release' && github.event.action == 'published'
       && github.event.release.prerelease == false
       && (startsWith(github.event.release.tag_name, 'release-v')
           || startsWith(github.event.release.tag_name, 'fpk-v')))
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    # ★ 跨 tag 串行：两次发版同时写同一份 fnpack.json 会互相覆盖
    #   （后推的覆盖先推的，先发的那个版本看起来就丢了）。
    concurrency:
      group: fndepot-index
      cancel-in-progress: false
    steps:
      # 取 tag 上的源码：CHANGELOG 与 package.json 必须是发布时的版本
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      # dispatch 只有 tag 字符串，没有事件体：自己去问 Release 的真实状态。
      # release 事件那条已由 job 的 if 判过 prerelease，这里再判一次 draft（幂等）。
      - name: 确认 Release 已发布
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          S="$(gh release view "$TAG" --json isDraft,isPrerelease 2>/dev/null)" \
            || fail "找不到 Release $TAG（draft 不会出现在列表里，也说明它还没发布）"
          DRAFT="$(jq -r '.isDraft' <<<"$S")"
          PRE="$(jq -r '.isPrerelease' <<<"$S")"
          [ "$DRAFT" = "false" ] || fail "Release $TAG 还是 draft，先点 Publish 再来"
          [ "$PRE" = "false" ] || fail "Release $TAG 是 prerelease，不算正式发布"
          echo "Release $TAG 已发布（draft=$DRAFT prerelease=$PRE）"

      # 版本以 package.json 为准；tag 必须等于 <前缀>-v<版本>。
      # release.yml / 本 workflow 的 plan 已各查过一次，这里是第三道
      # （防手工在网页上 Publish 一个被改过 tag 的草稿）。
      - name: 解析版本
        id: v
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          case "$TAG" in
            release-v[0-9]*|fpk-v[0-9]*) ;;
            *) fail "不是 fpk 相关 tag：$TAG" ;;
          esac
          VER="${TAG##*-v}"
          PV=$(node -p "require('./client/package.json').version")
          [ "$VER" = "$PV" ] || fail "tag=$TAG 的版本($VER) 与 package.json 的 $PV 不一致"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VER（tag=$TAG）"

      - name: 从 Release 取 fpk 资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          rm -rf dl artifacts
          mkdir -p dl artifacts/x86 artifacts/arm
          # 没有匹配资产时 gh 退出非 0（no assets match the file pattern），
          # 这里换成一句人话：多半是全量链的 fpk job 没跑/失败。
          gh release download "$TAG" --pattern 'meow_*.fpk' --dir dl \
            || fail "Release $TAG 里没有 meow_*.fpk 资产（这版没打 fpk？）"
          for arch in x86 arm; do
            SRC="dl/meow_${VER}_${arch}.fpk"
            [ -s "$SRC" ] || fail "Release 缺 meow_${VER}_${arch}.fpk（双架构是硬条件）"
            cp "$SRC" "artifacts/$arch/"
            # 口径与构建阶段一致：单行 `sha256sum --text`，第二列只记文件名。
            # --text 必需：MSYS 的 sha256sum 默认 binary 模式会写成 `*文件名`。
            ( cd "artifacts/$arch" \
              && sha256sum --text "meow_${VER}_${arch}.fpk" > "meow_${VER}_${arch}.fpk.sha256" )
          done
          ls -l artifacts/x86 artifacts/arm

      # sha256 只认上一步从发布资产算出来的 .fpk.sha256，不在这里造第二个口径。
      - name: 校验产物
        id: pkg
        shell: bash
        env:
          VER: ${{ steps.v.outputs.version }}
          ART: ${{ github.workspace }}/artifacts
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          for arch in x86 arm; do
            FPK="$ART/$arch/meow_${VER}_${arch}.fpk"
            SHAF="$FPK.sha256"
            [ -s "$FPK" ] || fail "缺少产物 $FPK"
            [ -s "$SHAF" ] || fail "缺少校验文件 $SHAF"
            [ "$(wc -l < "$SHAF" | tr -d '[:space:]')" -eq 1 ] || fail "$SHAF 不是单行 sha256sum 输出"
            H="$(awk '{print $1}' "$SHAF")"
            F="$(awk '{print $2}' "$SHAF")"
            [ "$F" = "$(basename "$FPK")" ] || fail "$SHAF 记录的文件是 $F，不是 $(basename "$FPK")"
            [[ "$H" =~ ^[0-9a-f]{64}$ ]] || fail "$SHAF 的 sha256 不是 64 位小写 hex：$H"
            SZ="$(stat -c%s "$FPK")"
            [[ "$SZ" =~ ^[0-9]+$ ]] || fail "$FPK 的 size 不是数字：$SZ"
            # 包体下限：漏打载荷时通常只剩几 MB
            [ "$SZ" -gt 10000000 ] || fail "$FPK 只有 $SZ bytes，疑似漏打载荷"
            echo "$arch: $H  $SZ bytes"
            {
              echo "${arch}_sha=$H"
              echo "${arch}_size=$SZ"
            } >> "$GITHUB_OUTPUT"
          done

      # ★ 同版本不可重打包（2026-11-13 用户撞到 size 校验失败后的门禁）：
      #   1.2.5 被打过两次（05:05 旧构建、06:41 正式构建），同名文件被就地覆盖，
      #   持有旧索引的客户端/应用中心就会拿到「expected=旧 size / actual=新 size」。
      #   已发布版本要改就升版本号；确实要覆盖时 dispatch 传 replace=true。
      - name: 同版本不可重打包
        if: ${{ !inputs.replace }}
        shell: bash
        env:
          VER: ${{ steps.v.outputs.version }}
          X_SHA: ${{ steps.pkg.outputs.x86_sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::拒绝覆盖已发布版本：$*"; exit 1; }
          D="$RUNNER_TEMP/dupcheck"
          rm -rf "$D"; mkdir -p "$D"; cd "$D"
          git init -q
          AUTH="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$AUTH"
          if git fetch -q --depth 1 origin fpk-updates 2>/dev/null              && git checkout -q FETCH_HEAD -- fpk.json 2>/dev/null; then
            OLD="$(jq -r --arg v "$VER" '.apps.meow.releases[$v].packages.x86.sha256 // ""' fpk.json)"
            if [ -n "$OLD" ] && [ "$OLD" != "$X_SHA" ]; then
              fail "主仓索引里已有 $VER（旧 sha ${OLD:0:12}…，本次 ${X_SHA:0:12}…）；升版本号，或 dispatch 传 replace=true"
            fi
          fi
          echo "同版本检查通过（$VER）"

      # ★ 更新说明的单一真源是 CHANGELOG.md 的 `## <版本>` 小节，
      #   规则与 release.yml / sync-packages.ps1 一致（空行丢弃、没编号的行补 `n. `）。
      #   抽不到就让整个发布失败，且这一步排在检出 FnDepot 之前——
      #   宁可索引不动，也不能把模板串写进去（用户侧看到的说明会一直是旧的）。
      - name: 抽取更新说明
        id: notes
        shell: bash
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          [ -f CHANGELOG.md ] || fail "CHANGELOG.md 不存在"

          # 标题只认 `## 1.0.9` / `## [1.0.9]` 两种写法：去掉 `## ` 后整串比较，
          # 保证 1.0.9 不会匹配到 1.0.90，也不会匹配到 1.0.9-fix1。
          NOTES="$(awk -v v="$VER" '
            /^##[[:blank:]]/ {
              h = $0
              sub(/^##[[:blank:]]+/, "", h)
              sub(/[[:blank:]]+$/, "", h)
              if (h == v || h == "[" v "]") { hit = 1; next }
              if (hit) exit
            }
            hit {
              t = $0
              gsub(/^[[:blank:]]+|[[:blank:]]+$/, "", t)
              if (t == "") next
              n++
              if (t ~ /^[0-9]+[[:blank:]]*[.、)]/) print t
              else print n ". " t
            }
          ' CHANGELOG.md)"

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            fail "CHANGELOG.md 缺少 ${VER} 小节"
          fi

          {
            echo "notes<<MEOW_EOF"
            printf '%s\n' "$NOTES"
            echo "MEOW_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "更新说明取自 CHANGELOG.md 的 ${VER} 小节："
          printf '%s\n' "$NOTES"

      # ★ 主仓索引先写（2026-11-13 定稿）：这条只用内置 GITHUB_TOKEN，最不容易失败。
      #   顺序反过来（先 FnDepot）时，后半段一失败就是「FnDepot 有新版本、壳内客户端
      #   全员卡旧版」；现在反过来，最坏也只是 fnOS 中心慢一步。
      # ★ download_url 指向**本次已发布的 Release**（tag 就是宿主），不可变、可加速。
      - name: 生成 fpk.json 并推 fpk-updates（合并已有版本）
        id: mainidx
        # 失败不中断：让 FnDepot 那半边照常尝试，最后由「结果汇总」统一判红。
        continue-on-error: true
        shell: bash
        env:
          VER: ${{ steps.v.outputs.version }}
          X_SHA: ${{ steps.pkg.outputs.x86_sha }}
          X_SIZE: ${{ steps.pkg.outputs.x86_size }}
          A_SHA: ${{ steps.pkg.outputs.arm_sha }}
          A_SIZE: ${{ steps.pkg.outputs.arm_size }}
          NOTES: ${{ steps.notes.outputs.notes }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::主仓索引未更新：$*"; exit 1; }
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 固定目录（不用 mktemp）：后面的一致性断言要读这份克隆。
          D="$RUNNER_TEMP/meow-main"
          rm -rf "$D"
          mkdir -p "$D"
          cd "$D"
          git init -q
          git config user.name "meow-ci"
          git config user.email "meow-ci@users.noreply.github.com"
          AUTH="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$AUTH"

          # ★ 合并而不是覆盖（2026-11-13 踩过）：这份索引以前每次 force 覆盖成
          #   "只有当前版本"，补发旧版本（回填 1.2.2）会把新版本（1.2.3）顶掉。
          #   现在先取**分支上真实的**文件做基线（走 git fetch，不读 raw/CDN，
          #   避免拿到 12 小时前的缓存），再把本版并进去。
          HAVE=0
          if git fetch -q --depth 1 origin fpk-updates 2>/dev/null; then
            if git checkout -q FETCH_HEAD -- fpk.json 2>/dev/null && jq -e . fpk.json >/dev/null 2>&1; then
              HAVE=1
            fi
          fi

          # os_min_version 的单一真源：沿用已有索引里最近一条，没有则 1.2.0。
          # 两份索引必须写同一个值，否则同一版本在客户端与 fnOS 中心显示的最低
          # 系统版本会漂移（之前 FnDepot 继承、这里硬编码 1.2.0，就是这么裂开的）。
          OSMIN="1.2.0"
          if [ "$HAVE" = "1" ]; then
            OSMIN="$(jq -r '[.apps.meow.releases[] | .os_min_version] | map(select(. != null)) | last // "1.2.0"' fpk.json)"
          fi
          echo "osmin=$OSMIN" >> "$GITHUB_OUTPUT"

          # 本版条目（不含外层骨架）。
          # ★ 用绝对路径：下面已经 cd 到临时仓库里，相对路径会指错目录。
          ENTRY="$GITHUB_WORKSPACE/entry.json"
          jq -n \
            --arg now "$NOW" --arg notes "$NOTES" --arg osmin "$OSMIN" \
            --arg xsha "$X_SHA" --argjson xsize "$X_SIZE" --arg xurl "$BASE/meow_${VER}_x86.fpk" \
            --arg asha "$A_SHA" --argjson asize "$A_SIZE" --arg aurl "$BASE/meow_${VER}_arm.fpk" \
            '{
              changelog: $notes,
              updated_at: $now,
              os_min_version: $osmin,
              packages: {
                x86: {download_url: $xurl, sha256: $xsha, size: $xsize},
                arm: {download_url: $aurl, sha256: $asha, size: $asize}
              }
            }' > "$ENTRY" || fail "生成条目失败"

          if [ "$HAVE" = "1" ]; then
            jq --arg ver "$VER" --slurpfile e "$ENTRY" \
              '.apps.meow.releases[$ver] = $e[0]' fpk.json > merged.json \
              || fail "合并到已有索引失败"
            mv merged.json fpk.json
            echo "已合并进已有索引（os_min_version=$OSMIN）"
          else
            jq -n --arg ver "$VER" --slurpfile e "$ENTRY" '{
              schema_version: "2",
              source_info: {name: "Meow main mirror", url: "https://github.com/upchr/meow"},
              apps: {meow: {releases: {($ver): $e[0]}}}
            }' > fpk.json || fail "新建索引失败"
            echo "分支没有可用索引，已新建（os_min_version=$OSMIN）"
          fi
          jq -e --arg ver "$VER" '.apps.meow.releases[$ver].packages.x86.sha256 and .apps.meow.releases[$ver].packages.arm.sha256' fpk.json >/dev/null \
            || fail "fpk.json 结构不合法"

          git add fpk.json
          git commit -q -m "fpk: ${VER} 主仓镜像索引"
          # force：分支上只有 fpk.json 一个文件，合并基线已取过
          git push --force "$AUTH" HEAD:fpk-updates || fail "推送 fpk-updates 失败"
          echo "已推送主仓 fpk-updates（${VER}，资产在 ${TAG}）"

      # 拿最新索引再动笔：并发组只覆盖本 workflow，别人手动推 FnDepot 时
      # 仍可能撞上，所以每次都在 clone 后强制对齐 origin/main。
      - name: 检出并同步 FnDepot
        id: depot
        # 失败不中断：主仓索引上面已经写完，这里失败只影响 fnOS 中心。
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          if [ -z "$TOKEN" ]; then
            fail "缺少 secrets.FNDEPOT_TOKEN（需要可写 upchr/FnDepot 的 PAT）"
          fi
          D="$RUNNER_TEMP/FnDepot"
          AUTH="https://x-access-token:${TOKEN}@github.com/upchr/FnDepot.git"
          # ★ 2026-11-27 起 FnDepot 只存索引与图标（包体由主仓 Release 托管），
          #   仓库体积 KB 级。仍然保留 --depth=1 --filter=blob:none：
          #   拉取更快、也不会因为将来有人误提交大文件而卡住。
          #   sparse-checkout 规则保留（现在没有匹配文件，纯属防御）。
          mkdir -p "$D"
          git -C "$D" init -q
          git -C "$D" remote add origin "https://github.com/upchr/FnDepot.git"
          git -C "$D" config core.sparseCheckout true
          printf '%s\n' '/*' '!meow/*.fpk' > "$D/.git/info/sparse-checkout"
          git -C "$D" fetch --depth=1 --filter=blob:none "$AUTH" main \
            || fail "拉取 FnDepot 索引失败（检查 PAT 是否过期/无权限）"
          git -C "$D" checkout -q FETCH_HEAD || fail "检出 FnDepot 索引失败"
          git -C "$D" log --oneline -1
          echo "repo=$D" >> "$GITHUB_OUTPUT"

      - name: 写前校验
        id: depotcheck
        if: steps.depot.outcome == 'success'
        shell: bash
        env:
          REPO: ${{ steps.depot.outputs.repo }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          IDX="$REPO/fnpack.json"
          fail() { echo "::error::索引未更新：$*"; exit 1; }

          [ -f "$IDX" ] || fail "FnDepot 仓库根目录没有 fnpack.json"
          # 同版本不可重打包（与主仓那条守卫同源，见「同版本不可重打包」步骤）
          if [ "${{ inputs.replace }}" != "true" ]; then
            OLD="$(jq -r --arg v "$VER" '.apps.meow.releases[$v].packages.x86.sha256 // ""' "$IDX")"
            if [ -n "$OLD" ] && [ "$OLD" != "${{ steps.pkg.outputs.x86_sha }}" ]; then
              fail "FnDepot 已有 $VER 且 sha 不同（旧 ${OLD:0:12}…）；升版本号，或 dispatch 传 replace=true"
            fi
          fi
          jq -e '(keys | sort) == ["apps", "schema_version", "source_info"]' "$IDX" >/dev/null \
            || fail "fnpack.json 顶层不再是 schema_version / source_info / apps 三键"
          jq -e '.schema_version == "2"' "$IDX" >/dev/null \
            || fail "schema_version 不是 \"2\""
          jq -e '(.apps | type) == "object" and (.apps | has("meow"))' "$IDX" >/dev/null \
            || fail "apps.meow 不存在"
          jq -e '(.apps.meow.releases | type) == "object"' "$IDX" >/dev/null \
            || fail "apps.meow.releases 不是对象"

          # 其余节点先拍快照：写完再比对，证明 toolsplus / source_info /
          # 旧 meow 版本一个字节都没动。
          jq -S --arg ver "$VER" '{
            schema_version,
            source_info,
            toolsplus: (.apps.toolsplus // null),
            meow_others: (.apps.meow | del(.releases[$ver]))
          }' "$IDX" > "$RUNNER_TEMP/before.json"

      - name: 写入 releases[版本] 并校验结果
        id: depotwrite
        if: steps.depotcheck.outcome == 'success'
        shell: bash
        env:
          REPO: ${{ steps.depot.outputs.repo }}
          ART: ${{ github.workspace }}/artifacts
          VER: ${{ steps.v.outputs.version }}
          X_SHA: ${{ steps.pkg.outputs.x86_sha }}
          X_SIZE: ${{ steps.pkg.outputs.x86_size }}
          A_SHA: ${{ steps.pkg.outputs.arm_sha }}
          A_SIZE: ${{ steps.pkg.outputs.arm_size }}
          NOTES: ${{ steps.notes.outputs.notes }}
          # 与主仓索引同一个值（主仓那步算好、这里复用），两份索引不再各算一遍
          OSMIN: ${{ steps.mainidx.outputs.osmin || '1.2.0' }}
        run: |
          set -euo pipefail
          IDX="$REPO/fnpack.json"
          NEW="$RUNNER_TEMP/fnpack.new.json"
          fail() { echo "::error::索引未更新：$*"; exit 1; }

          # ★ download_url 写**主仓 Release 绝对直链**（2026-11-27 改造）：
          #   FnDepot 不再托管 meow 包体，仓库只留索引与图标，体积恒定在 KB 级。
          #   依据：官方 FnDepot 说明明确「所有资源与 FPK 均由 JSON 内 URL 定位
          #   （绝对或相对）」；Release 资产发布后不可变，tag 不移动，URL 永久有效。
          #   代价：gitee 镜像只能镜像索引，包体仍走 GitHub（国内可能慢）。
          # ★ 不用 gitee：镜像仓库里没有包体，相对路径会 404。
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          XURL="${BASE}/meow_${VER}_x86.fpk"
          AURL="${BASE}/meow_${VER}_arm.fpk"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 只赋值 apps.meow.releases[$ver]；同版本重跑会覆盖自己那条，
          # 不重复追加。changelog 每版都从 CHANGELOG.md 重写（不留旧值），
          # os_min_version 由主仓那步统一给出（单一真源，避免两份索引漂移）。
          jq --arg ver "$VER" --arg now "$NOW" --arg notes "$NOTES" \
             --arg osmin "$OSMIN" \
             --arg xsha "$X_SHA" --argjson xsize "$X_SIZE" --arg xurl "$XURL" \
             --arg asha "$A_SHA" --argjson asize "$A_SIZE" --arg aurl "$AURL" '
            .apps.meow.releases[$ver] = {
                changelog: $notes,
                updated_at: $now,
                os_min_version: $osmin,
                packages: {
                  x86: {download_url: $xurl, sha256: $xsha, size: $xsize},
                  arm: {download_url: $aurl, sha256: $asha, size: $asize}
                }
              }' "$IDX" > "$NEW" || fail "jq 写入失败"

          jq -e --arg ver "$VER" --arg notes "$NOTES" \
                --arg xsha "$X_SHA" --arg asha "$A_SHA" \
                --arg xurl "$XURL" --arg aurl "$AURL" '
            .schema_version == "2"
            and (.apps.meow.releases[$ver].changelog == $notes)
            and (.apps.meow.releases[$ver].packages.x86.sha256 == $xsha)
            and (.apps.meow.releases[$ver].packages.arm.sha256 == $asha)
            and (.apps.meow.releases[$ver].packages.x86.download_url == $xurl)
            and (.apps.meow.releases[$ver].packages.arm.download_url == $aurl)
            and ([.apps.meow.releases[$ver].packages[].sha256] | all(test("^[0-9a-f]{64}$")))
            and ([.apps.meow.releases[$ver].packages[].size] | all(type == "number"))
          ' "$NEW" >/dev/null || fail "写出的索引结构不合法（架构/校验值/下载地址）"

          jq -S --arg ver "$VER" '{
            schema_version,
            source_info,
            toolsplus: (.apps.toolsplus // null),
            meow_others: (.apps.meow | del(.releases[$ver]))
          }' "$NEW" > "$RUNNER_TEMP/after.json"
          diff -u "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" \
            || fail "除 apps.meow.releases[$VER] 外的节点被改动"

          mv "$NEW" "$IDX"

          # ★ 2026-11-27 起不再把 fpk 拷进 FnDepot：索引里的 download_url 是主仓
          #   Release 绝对直链，库内没有包体。校验资产确实存在于本次 Release
          #   （sha/size 已由上游步骤从发布资产算出，这里只断言本地有产物可核对）。
          for arch in x86 arm; do
            SRC="$ART/$arch/meow_${VER}_${arch}.fpk"
            [ -s "$SRC" ] || fail "缺少 $SRC，索引里的直链会指向不存在的资产"
          done
          echo "索引已写入主仓 Release 直链（不落包体到 FnDepot）"

      # 只保留最近 keep 版（默认 5）：只删索引条目。
      #
      # 为什么 5：客户端只取"大于当前版本的最大值"，中间版本没有功能作用；保留的多是
      # 兜底——os_min_version 上调后老系统要能回退到低版本，以及商店旧索引缓存窗口。
      # ★ 2026-11-27 起包体不在 FnDepot（download_url 是主仓 Release 绝对直链），
      #   所以这里没有 "包体文件一起删" 这一步；主仓 Release 资产永久保留。
      # ★ 若以后大幅上调 os_min_version，记得临时把 keep 调大或手工留一版。
      - name: 精简旧版本
        id: depotprune
        if: steps.depotwrite.outcome == 'success'
        shell: bash
        env:
          REPO: ${{ steps.depot.outputs.repo }}
          KEEP: ${{ inputs.keep || '5' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          cd "$REPO"
          IDX=fnpack.json
          KEEP="${KEEP:-5}"
          case "$KEEP" in ''|*[!0-9]*) fail "keep 必须是正整数：$KEEP" ;; esac
          [ "$KEEP" -ge 1 ] || fail "keep 至少为 1"

          # tr -d '\r'：Windows 上的 jq 会输出 CRLF，带着 \r 的版本号查 releases 永远查不到
          # （本地演练实测过）。CI 是 Linux 无所谓，顺手抹掉让本地也能复现。
          mapfile -t ALL < <(jq -r '.apps.meow.releases | keys[]' "$IDX" | tr -d '\r' | sort -V)
          total=${#ALL[@]}
          if [ "$total" -le "$KEEP" ]; then
            echo "版本数 $total ≤ keep=$KEEP，无需精简"
            exit 0
          fi
          drop_n=$((total - KEEP))
          DROP=("${ALL[@]:0:drop_n}")
          KEPT=("${ALL[@]:drop_n}")

          printf '%s\n' "${DROP[@]}" \
            | jq -R -s 'split("\n") | map(select(length > 0))' > "$RUNNER_TEMP/drop.json"
          jq --slurpfile drop "$RUNNER_TEMP/drop.json" \
            '.apps.meow.releases |= with_entries(select(.key as $k | ($drop[0] | index($k)) == null))' \
            "$IDX" > "$RUNNER_TEMP/fnpack.pruned.json"
          mv "$RUNNER_TEMP/fnpack.pruned.json" "$IDX"

          # 断言：保留的版本一个不少、删掉的确实不在了
          jq -e --argjson keep "$KEEP" '.apps.meow.releases | length == $keep' "$IDX" >/dev/null \
            || fail "精简后版本数与 keep=$KEEP 不一致"
          echo "已精简：删除 ${DROP[*]}；保留 ${KEPT[*]}（只删索引条目，包体在主仓 Release）"

      - name: 提交并推送
        id: depotpush
        if: steps.depotwrite.outcome == 'success'
        shell: bash
        env:
          REPO: ${{ steps.depot.outputs.repo }}
          VER: ${{ steps.v.outputs.version }}
          TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::索引未更新：$*"; exit 1; }
          cd "$REPO"
          AUTH="https://x-access-token:${TOKEN}@github.com/upchr/FnDepot.git"
          # ★ 2026-11-27：只提交 fnpack.json。meow 包体不再进本仓库，
          #   download_url 指向主仓 Release 绝对直链，所以没有 --sparse 的必要。
          git add fnpack.json
          # 幂等：同版本重跑且产物没变时不留空提交。
          if git diff --cached --quiet; then
            echo "索引与包体无实质变化，跳过提交"
            exit 0
          fi
          git config user.name "meow-ci"
          git config user.email "meow-ci@users.noreply.github.com"
          git commit -m "meow: 发布 ${VER}（x86/arm）"
          # 被外部提交抢先时同步重试；仍失败就显式报「索引未更新」。
          for i in 1 2 3; do
            if ! git pull --rebase --autostash "$AUTH" main; then
              git rebase --abort || true
              fail "与远端 main 冲突，无法同步"
            fi
            if git push "$AUTH" HEAD:main; then
              echo "已推送 FnDepot main"
              exit 0
            fi
            echo "第 $i 次推送被拒，同步后重试"
            sleep 2
          done
          fail "推送 upchr/FnDepot 失败（检查 FNDEPOT_TOKEN 的仓库写权限）"

      # ── 一致性断言：两份索引对同一版本必须给出同一份事实 ──────────────
      # 读远端真实状态（git fetch），不用 raw/CDN —— 那些有 5~12 分钟缓存。
      - name: 校验两份索引一致
        if: always()
        shell: bash
        env:
          VER: ${{ steps.v.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
        run: |
          set -euo pipefail
          warn() { echo "::warning::$*"; }
          fail() { echo "::error::$*"; exit 1; }

          MAIN="$RUNNER_TEMP/assert-main.json"
          DEP="$RUNNER_TEMP/assert-depot.json"
          rm -f "$MAIN" "$DEP"

          D="$RUNNER_TEMP/meow-main"
          if [ -d "$D" ]; then
            git -C "$D" fetch -q origin fpk-updates 2>/dev/null && git -C "$D" show FETCH_HEAD:fpk.json > "$MAIN" 2>/dev/null || true
          fi

          E="$RUNNER_TEMP/FnDepot"
          if [ -n "${DEPOT_TOKEN:-}" ] && [ -d "$E" ]; then
            A="https://x-access-token:${DEPOT_TOKEN}@github.com/upchr/FnDepot.git"
            # 与检出时同样的浅克隆 + 无 blob：只取 fnpack.json 这一个文件所在的树
            git -C "$E" fetch -q --depth=1 --filter=blob:none "$A" main 2>/dev/null \
              && git -C "$E" show FETCH_HEAD:fnpack.json > "$DEP" 2>/dev/null || true
          fi

          [ -s "$MAIN" ] || { warn "读不到主仓索引，跳过一致性比对（上面应已报错）"; exit 0; }
          [ -s "$DEP" ]  || { warn "读不到 FnDepot 索引，跳过一致性比对（上面应已报错）"; exit 0; }

          for f in "$MAIN" "$DEP"; do
            jq -e --arg v "$VER" '.apps.meow.releases[$v]' "$f" >/dev/null || fail "$VER 没有写进 $(basename "$f")"
          done

          for arch in x86 arm; do
            MS="$(jq -r --arg v "$VER" --arg a "$arch" '.apps.meow.releases[$v].packages[$a].sha256' "$MAIN")"
            DS="$(jq -r --arg v "$VER" --arg a "$arch" '.apps.meow.releases[$v].packages[$a].sha256' "$DEP")"
            [ "$MS" = "$DS" ] || fail "$VER $arch 的 sha256 不一致：主仓 $MS / FnDepot $DS"
            MZ="$(jq -r --arg v "$VER" --arg a "$arch" '.apps.meow.releases[$v].packages[$a].size' "$MAIN")"
            DZ="$(jq -r --arg v "$VER" --arg a "$arch" '.apps.meow.releases[$v].packages[$a].size' "$DEP")"
            [ "$MZ" = "$DZ" ] || fail "$VER $arch 的 size 不一致：主仓 $MZ / FnDepot $DZ"
          done

          MO="$(jq -r --arg v "$VER" '.apps.meow.releases[$v].os_min_version' "$MAIN")"
          DO="$(jq -r --arg v "$VER" '.apps.meow.releases[$v].os_min_version' "$DEP")"
          [ "$MO" = "$DO" ] || fail "$VER 的 os_min_version 不一致：主仓 $MO / FnDepot $DO"

          # 版本集合只告警不判红：1.2.1/1.2.2/1.2.5 只进过 FnDepot（当时还没有
          # 主仓镜像那一步），回填是单独的事，不能让每次发版都红。
          jq -r '.apps.meow.releases | keys[]' "$MAIN" | sort > "$RUNNER_TEMP/v-main.txt"
          jq -r '.apps.meow.releases | keys[]' "$DEP"  | sort > "$RUNNER_TEMP/v-depot.txt"
          ONLY_DEP="$(comm -13 "$RUNNER_TEMP/v-main.txt" "$RUNNER_TEMP/v-depot.txt" | paste -sd' ' -)"
          ONLY_MAIN="$(comm -23 "$RUNNER_TEMP/v-main.txt" "$RUNNER_TEMP/v-depot.txt" | paste -sd' ' -)"
          [ -z "$ONLY_DEP" ]  || warn "只在 FnDepot 里有的版本：$ONLY_DEP"
          # 主仓镜像保留全部版本、FnDepot 只留最近 keep 版（2026-11-16 起），
          # 所以"只在主仓有"是预期状态，只打印不告警。
          [ -z "$ONLY_MAIN" ] || echo "主仓镜像比 FnDepot 多出的历史版本（预期）：$ONLY_MAIN"

          echo "两份索引一致：$VER（x86/arm 的 sha256、size、os_min_version 全部相同）"

      # ── 结果汇总：任一侧没写成就是发版异常，不能让日志绿着过去 ──────────
      - name: 结果汇总
        if: always()
        shell: bash
        env:
          MAIN: ${{ steps.mainidx.outcome }}
          DEPOT: ${{ steps.depotpush.outcome }}
        run: |
          set -euo pipefail
          BAD=0
          if [ "$MAIN" != "success" ]; then
            echo "::error::主仓索引未更新（fpk-updates）：壳内「立即更新」拿不到这一版"
            BAD=1
          fi
          if [ "$DEPOT" != "success" ]; then
            echo "::error::FnDepot 索引未更新：fnOS 应用中心拿不到这一版"
            BAD=1
          fi
          [ "$BAD" = "0" ] || exit 1
          echo "两份索引都已更新"
