name: _ios

# 真机未签名 IPA：内嵌 OpenJDK 9 Zero + ApiServer。
#
# ★ 2026-11-24 起接入主发版链：release.yml 的 `ios` job 用 workflow_call 调本文件，
#   `release-v*` 全量 tag 会带出 IPA，与 TV/PC/fpk 同页发布；不再靠
#   feat/ios-jvm 的 push 单独出包（分支已合入 main）。
#   只想给自己装一个时，在 Actions 页面手动 dispatch 本 workflow。
# 快速 UI 截图见 _ios_ui.yml（不构建 App，60–120 秒）。
on:
  workflow_call:
    inputs:
      # 可选覆盖 IPA 的 CFBundleShortVersionString（release.yml 传 plan 解析出的版本）。
      # 留空 = 用 Info.plist 里由 bump-version 维护的版本。
      version:
        description: '版本号（留空用 Info.plist 里的 CFBundleShortVersionString）'
        type: string
        required: false
        default: ''
      sim:
        description: 同时构建模拟器包并截图（约 +4 分钟）
        type: boolean
        default: false
      nojvm:
        description: 排障变体：不链接静态 JVM（用来二分「闪退是否来自 JVM」）
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空用 Info.plist 里的 CFBundleShortVersionString）'
        type: string
        required: false
        default: ''
      sim:
        description: 同时构建模拟器包并截图（约 +4 分钟）
        type: boolean
        default: false
      nojvm:
        description: 排障变体：不链接静态 JVM（用来二分「闪退是否来自 JVM」）
        type: boolean
        default: false
      publish_test:
        description: '把 IPA 覆盖上传到测试 Release（ipa-test，固定直链）'
        type: boolean
        default: false

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    # 手动 dispatch 会把 IPA 覆盖上传到测试 Release（ipa-test），需要写权限。
    # release.yml 以 workflow_call 调本文件时不会走那一步（见步骤里的 event_name 判断）。
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 版本号统一在这里解析一次（与 _docker/_pc_shell/_tv 同约定）：
      # 传了 inputs.version 就用它；留空则读 Info.plist（bump-version 维护的那份）。
      # 产物文件名与 artifact 名都用这个值，和 TV/PC/fpk 的 <名字>-<版本> 对齐。
      - name: 解析版本
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v='${{ inputs.version }}'
          if [ -z "$v" ]; then
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" client/apps/ios/Meow/Info.plist)
          fi
          [ -n "$v" ] || { echo "读不到版本号" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本：$v"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Cache web dist
        id: webdist
        uses: actions/cache@v4
        with:
          path: client/apps/web/dist
          key: ios-webdist-${{ hashFiles('client/apps/web/src/**', 'client/apps/web/package.json', 'client/apps/web/vite.config.ts', 'client/apps/web/index.html', 'client/pnpm-lock.yaml', 'client/package.json') }}

      - name: Build web dist
        if: steps.webdist.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd client
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache host jar
        id: hostjar
        uses: actions/cache@v4
        with:
          path: client/apps/ios/build/jvm
          key: ios-hostjar-${{ hashFiles('server/host/src/**', 'client/apps/ios/host-stub/**', 'client/apps/ios/vendor/dex2jar/**', 'server/host/libs/**', 'client/apps/ios/scripts/build-host.sh') }}

      - name: Build iOS host jar
        if: steps.hostjar.outputs.cache-hit != 'true'
        run: bash client/apps/ios/scripts/build-host.sh

      - name: Stamp build id into Info.plist
        run: |
          set -euo pipefail
          BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M)"
          echo "build_id=$BUILD_ID"
          PLIST=client/apps/ios/Meow/Info.plist
          /usr/libexec/PlistBuddy -c "Add :MeowBuild string $BUILD_ID" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :MeowBuild $BUILD_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :MeowBuild" "$PLIST"
          echo "$BUILD_ID" > client/apps/ios/build/build-id.txt

      # 版本号与其它端同源：默认用 Info.plist 里的（bump-version 维护），
      # release.yml 会把 plan 解析出的版本传进来 —— 这样即使漏 bump 了
      # Info.plist，IPA 的 CFBundleShortVersionString 也跟 tag 一致。
      - name: Stamp version into Info.plist
        if: ${{ inputs.version != '' }}
        run: |
          set -euo pipefail
          PLIST=client/apps/ios/Meow/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version }}" "$PLIST"
          echo -n "CFBundleShortVersionString="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache OpenJDK runtime tarballs
        uses: actions/cache@v4
        with:
          path: client/apps/ios/build/cache
          key: ios-jdk9-bundle-v1

      - name: Prepare OpenJDK 9 Zero + libOpenJDK.a
        run: bash client/apps/ios/scripts/prepare-runtime.sh

      # Phase 1：裁掉运行期不用的工具链/CORBA/WS/JAXB 模块（modules 133→91MB）。
      # 生成需要 JDK 9 jlink，iOS runner 上只有 11/17/21/25；产物由
      # client/apps/ios/scripts/trim-java-modules.sh 在本地生成，固定在独立 release tag
      # ios-openjdk9-modules-v1.0-lib（不进仓库、不挂 ipa-test）。这里只下载+校验 sha256。
      # 上游 bundle tag 变化时重新生成并新建 tag，不复用旧资产。
      - name: Apply trimmed OpenJDK modules (Phase 1)
        run: |
          set -euo pipefail
          URL="https://github.com/upchr/meow/releases/download/ios-openjdk9-modules-v1.0-lib/openjdk9-ios-arm64-modules-phase1-v1.0-lib.zip"
          SHA256="b871d4a08477bf67de421c3f811c88efa7bd10adb5b1ddd123d5586941a0dd5d"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/openjdk-modules.zip "$URL"
          echo "$SHA256  /tmp/openjdk-modules.zip" | shasum -a 256 -c -
          rm -rf /tmp/openjdk-modules && mkdir -p /tmp/openjdk-modules
          unzip -q /tmp/openjdk-modules.zip -d /tmp/openjdk-modules
          cp /tmp/openjdk-modules/modules client/apps/ios/build/openjdk/lib/modules
          cp /tmp/openjdk-modules/release client/apps/ios/build/openjdk/release
          echo "[trim] applied $(du -h client/apps/ios/build/openjdk/lib/modules | cut -f1)"

          # 门禁：模块数 + 关键模块 + 体积（与生成时一致）
          M=client/apps/ios/build/openjdk/lib/modules
          JIMAGE="$(dirname "$(command -v java)")/jimage"
          "$JIMAGE" list "$M" > /tmp/mods.txt
          N=$(grep -c '^Module: ' /tmp/mods.txt)
          [ "$N" -eq 56 ] || { echo "::error title=trim::模块数 $N != 56"; exit 1; }
          for m in java.base java.logging java.xml java.security.jgss jdk.httpserver \
                   java.sql java.naming java.scripting java.desktop jdk.localedata \
                   jdk.crypto.ec jdk.charsets jdk.zipfs jdk.unsupported; do
            grep -qx "Module: $m" /tmp/mods.txt || { echo "::error title=trim::缺模块 $m"; exit 1; }
          done
          [ "$(stat -f%z "$M")" -lt 110000000 ] || { echo "::error title=trim::modules 仍然过大"; exit 1; }

      # 端内 Node 运行时（nodejs-mobile，52MB 动态库）+ 弹幕载荷（danmu_api，~40MB）
      # + JS 源载荷（drpy，裁后 ~7.4MB）
      - name: Cache node runtime + payloads
        id: nodepayload
        uses: actions/cache@v4
        with:
          path: |
            client/apps/ios/build/node
            client/apps/ios/build/danmu-api
            client/apps/ios/build/drpy
          key: ios-node-danmu-${{ hashFiles('client/apps/ios/scripts/prepare-node-runtime.sh', 'client/apps/ios/scripts/prepare-danmu-payload.sh', 'client/apps/ios/scripts/prepare-drpy-payload.sh', 'server/drpy/package-lock.json') }}

      - name: Prepare Node runtime + payloads
        if: steps.nodepayload.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash client/apps/ios/scripts/prepare-node-runtime.sh
          bash client/apps/ios/scripts/prepare-danmu-payload.sh
          bash client/apps/ios/scripts/prepare-drpy-payload.sh

      - name: Verify node + payloads staged
        run: |
          set -euo pipefail
          test -d client/apps/ios/build/node/NodeMobile.framework || { echo "NodeMobile.framework missing"; exit 1; }
          test -f client/apps/ios/build/danmu-api/danmu_api/server.js || { echo "danmu payload missing"; exit 1; }
          test -f client/apps/ios/build/drpy/server.js || { echo "drpy payload missing"; exit 1; }
          test -f client/apps/ios/build/drpy/node_modules/undici/index.js || { echo "drpy undici stub missing"; exit 1; }
          du -sh client/apps/ios/build/node/NodeMobile.framework client/apps/ios/build/danmu-api client/apps/ios/build/drpy

      # 端内 CPython（Python-Apple-support 3.12-b13，裁后 framework 8MB + runtime 25MB，
      # zip 后约 9MB）。缓存整包：下载 32MB + 组装 1~2 分钟。
      - name: Cache CPython payload
        id: pypayload
        uses: actions/cache@v4
        with:
          path: |
            client/apps/ios/build/pycache
            client/apps/ios/build/python
          key: ios-python-3.12-b13-${{ hashFiles('client/apps/ios/scripts/prepare-python-payload.sh', 'client/apps/ios/python-shim/**', 'server/pyrt/pyrt.py') }}

      - name: Prepare CPython payload
        if: steps.pypayload.outputs.cache-hit != 'true'
        run: bash client/apps/ios/scripts/prepare-python-payload.sh

      # 端内 VLCKit（MobileVLCKit 3.7.5）：web 播不了 MKV/AVI/FLV/DTS 时的
      # 原生兜底。tar.xz 约 230MB、解压后只留 arm64 真机 slice；缓存整包，
      # 否则每次 CI 都要重下 230MB。
      - name: Cache VLCKit
        id: vlckit
        uses: actions/cache@v4
        with:
          path: |
            client/apps/ios/build/vlckit-cache
            client/apps/ios/build/vlckit
          key: ios-vlckit-3.7.5-${{ hashFiles('client/apps/ios/scripts/prepare-vlckit.sh') }}

      - name: Prepare VLCKit
        if: steps.vlckit.outputs.cache-hit != 'true'
        run: bash client/apps/ios/scripts/prepare-vlckit.sh

      - name: Verify VLCKit staged
        run: |
          set -euo pipefail
          BIN=client/apps/ios/build/vlckit/MobileVLCKit.framework/MobileVLCKit
          test -f "$BIN" || { echo "MobileVLCKit.framework missing"; exit 1; }
          lipo -info "$BIN"
          du -sh client/apps/ios/build/vlckit/MobileVLCKit.framework

      - name: Verify CPython staged
        run: |
          set -euo pipefail
          test -f client/apps/ios/build/python/runtime/pyrt.py || { echo "pyrt.py missing"; exit 1; }
          test -f client/apps/ios/build/python/Python.framework/Python || { echo "Python.framework missing"; exit 1; }
          test -f client/apps/ios/build/python/pyext/_ssl.cpython-312-iphoneos.so || { echo "_ssl missing"; exit 1; }
          du -sh client/apps/ios/build/python/Python.framework client/apps/ios/build/python/runtime

      # ★ Frameworks/pyext 里的 .so 必须自带签名。
      #   侧载器（SideStore/AltStore）按 .framework 递归签名，散装扩展目录经常
      #   被漏掉；iOS 不允许 dlopen 无签名可执行页，症状是 pyrt.py 在 import
      #   阶段就挂（`_random`/`_socket` 这类 C 扩展全是 .so），设置页只显示
      #   “CPython 不可用”。构建期先打 ad-hoc 签名：侧载器重签会覆盖它，
      #   不重签时它自己也能被加载。Python.framework 一并签，防上游 asset 未签。
      - name: Ad-hoc sign CPython payload
        run: |
          set -euo pipefail
          P=client/apps/ios/build/python
          find "$P/pyext" -name '*.so' -type f -print0 \
            | xargs -0 -n1 codesign --force --sign - --timestamp=none
          # 先签 framework bundle；上游没带 Info.plist 时退到直接签二进制
          if ! codesign --force --sign - --timestamp=none "$P/Python.framework"; then
            codesign --force --sign - --timestamp=none "$P/Python.framework/Python"
          fi
          codesign --verify --strict "$P/Python.framework/Python"
          codesign --verify --strict "$P/pyext/_ssl.cpython-312-iphoneos.so"
          echo "[py] ad-hoc signed $(find "$P/pyext" -name '*.so' -type f | wc -l) extensions"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd client/apps/ios
          xcodegen generate

      - name: Build unsigned device IPA
        env:
          NOJVM: ${{ inputs.nojvm && '1' || '0' }}
        run: |
          set -euo pipefail
          cd client/apps/ios
          if [ "$NOJVM" = "1" ]; then
            # 排障变体：**不链接** OpenJDK 静态库，JNI 代码也被预处理掉。
            # 用来判定闪退是否由「静态 JVM 的链接/静态初始化」引起：
            #   - 这个包能起来 → 问题在 JVM 链接层（dyld 构造器）或启动那一刻；
            #   - 这个包也闪退 → 与 JVM 无关，是包/侧载器层面。
            echo "== NOJVM variant: static JVM NOT linked =="
            xcodebuild -project Meow.xcodeproj -scheme Meow -configuration Release \
              -sdk iphoneos -derivedDataPath build/dd-device \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              GCC_PREPROCESSOR_DEFINITIONS=MEOW_NO_JVM=1 \
              "OTHER_LDFLAGS=-Wl,-all_load -Wl,-export_dynamic -lc++ -lz -liconv -framework Foundation -framework UIKit -framework WebKit -framework Network -framework Security" \
              build 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/xcodebuild-device.log" | tail -40
          else
            xcodebuild -project Meow.xcodeproj -scheme Meow -configuration Release \
              -sdk iphoneos -derivedDataPath build/dd-device \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              build 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/xcodebuild-device.log" | tail -40
          fi
          APP=$(find build/dd-device/Build/Products/Release-iphoneos -maxdepth 1 -name 'Meow.app' | sed -n '1p')
          test -n "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          IPA_NAME="Meow-unsigned-${{ steps.ver.outputs.version }}.ipa"
          if [ "$NOJVM" = "1" ]; then IPA_NAME="Meow-unsigned-nojvm-${{ steps.ver.outputs.version }}.ipa"; fi
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" Payload)
          ls -lh "$GITHUB_WORKSPACE/artifacts/$IPA_NAME"
          du -sh "$APP" || true
          # ★ 门禁：JDK 源码包 src.zip 约 61MB（占 IPA 四成），运行期用不到，
          #   prepare-runtime.sh 已经剔除；这里防止以后改脚本又把它带回来。
          if unzip -l "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" | grep -q 'openjdk/lib/src.zip'; then
            echo "ERROR: openjdk/lib/src.zip 又被打进 IPA 了（应剔除，约 61MB）" >&2
            exit 1
          fi
          # ★ 门禁：端内 CPython / pyrt 必须在包里（否则 .py 源静默退回远端）
          if ! unzip -l "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" | grep -q 'Payload/Meow.app/runtime/pyrt.py'; then
            echo "ERROR: runtime/pyrt.py 没打进 IPA" >&2
            exit 1
          fi
          if ! unzip -l "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" | grep -q 'Frameworks/Python.framework/Python'; then
            echo "ERROR: Python.framework 没 embed 进 IPA" >&2
            exit 1
          fi
          if ! unzip -l "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" | grep -q 'Frameworks/pyext/_ssl.cpython-312-iphoneos.so'; then
            echo "ERROR: Frameworks/pyext 缺失（C 扩展无法加载）" >&2
            exit 1
          fi
          # 签名必须活到 IPA 里：Xcode 的 copyFiles 若改了字节，ad-hoc 签名会失效，
          # 真机上 dlopen 直接被拒（pyrt 起不来，Documents/py.log 里是 ImportError）
          if ! codesign --verify --strict "$APP/Frameworks/pyext/_ssl.cpython-312-iphoneos.so"; then
            echo "ERROR: pyext 的 ad-hoc 签名在打包后失效" >&2
            exit 1
          fi
          # Phase 1 裁减后的 modules 必须 <110MB（原版 133MB）。防止 trim 步骤被跳过/
          # 产物没覆盖进 App，却仍然发了一个“以为裁过”的包。
          MOD_BYTES=$(stat -f%z "$APP/openjdk/lib/modules")
          if [ "$MOD_BYTES" -ge 110000000 ]; then
            echo "ERROR: openjdk/lib/modules 仍是完整版（$MOD_BYTES B），trim 没生效" >&2
            exit 1
          fi
          echo "openjdk modules: $MOD_BYTES bytes"
          echo "ipa bytes: $(stat -f%z "$GITHUB_WORKSPACE/artifacts/$IPA_NAME")"
          # 包里到底装了什么：条目数 / 体积 / 构建标识，闪退排查时先对这三个数
          echo "== bundle inventory =="
          find "$APP" -type f | wc -l
          du -sh "$APP"
          du -sh "$APP/runtime" "$APP/Frameworks/Python.framework" "$APP/Frameworks/pyext" || true
          /usr/libexec/PlistBuddy -c "Print :MeowBuild" "$APP/Info.plist" || true
          ls "$APP/jvm" "$APP/jvm/libs" | head -40
          echo "== frameworks =="
          ls -lh "$APP/Frameworks" || true
          nm -gU "$APP/Frameworks/libOpenJDK.dylib" 2>/dev/null | grep -E "_JNI_CreateJavaVM$" || true
          nm -gU "$APP/Frameworks/libmeow-smoke.dylib" 2>/dev/null | grep -E "_meow_smoke$" || true

      - name: Build simulator app
        if: ${{ inputs.sim }}
        run: |
          set -euo pipefail
          cd client/apps/ios
          xcodebuild -project Meow.xcodeproj -scheme MeowSim -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build/dd-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/xcodebuild-sim.log" | tail -30

      - name: Start mock + host for simulator
        if: ${{ inputs.sim }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meow-data"
          cp client/apps/ios/scripts/ci-config.json "$RUNNER_TEMP/meow-data/config.sites.json"
          nohup python3 client/apps/ios/scripts/mock_cms.py --port 8099 \
            > "$RUNNER_TEMP/mock.log" 2>&1 &
          nohup java -cp "client/apps/ios/build/jvm/host.jar:client/apps/ios/build/jvm/libs/*" \
            ApiServer --port=9978 --data-dir="$RUNNER_TEMP/meow-data" \
            > "$RUNNER_TEMP/host.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/host.pid"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9978/api/health > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Simulator screenshot
        if: ${{ always() && inputs.sim }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and d['name'].startswith('iPhone'):
                      print(d['udid'])
                      raise SystemExit
          raise SystemExit('no iPhone simulator')
          PY
          )
          echo "simulator=$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b &
          BPID=$!
          ( sleep 150; kill "$BPID" 2>/dev/null || true ) &
          WPID=$!
          wait "$BPID" || echo "[ios] bootstatus timeout (continue)"
          kill "$WPID" 2>/dev/null || true
          APP=$(find client/apps/ios/build/dd-sim/Build/Products/Debug-iphonesimulator -maxdepth 2 -name 'MeowSim.app' | sed -n '1p')
          test -n "$APP"
          xcrun simctl install "$UDID" "$APP" || echo "[ios] install failed"
          xcrun simctl launch "$UDID" com.meow.player.ios.sim \
            --api-base=http://127.0.0.1:9978 --site=CI演示 || echo "[ios] launch failed"
          sleep 18
          xcrun simctl io "$UDID" screenshot artifacts/ios-home.png || true

      - name: Stop host
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/host.pid" ]; then kill "$(cat "$RUNNER_TEMP/host.pid")" 2>/dev/null || true; fi
          cp "$RUNNER_TEMP/host.log" artifacts/host.log 2>/dev/null || true
          cp "$RUNNER_TEMP/mock.log" artifacts/mock.log 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 与发布资产同名对齐：ios-ipa-<版本>[-nojvm]；解析失败时退回 run_number
          name: ios-ipa-${{ steps.ver.outputs.version || github.run_number }}${{ inputs.nojvm && '-nojvm' || '' }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

      # 手动 dispatch：把 IPA 覆盖上传到独立测试 Release（ipa-test）。
      #
      # ★ 不要挂到正式 Release：正式页只放发版产物。
      # ★ 用 GITHUB_TOKEN 创建/更新 Release：该 token 触发的事件不会再生成
      #   工作流（GitHub 防递归规则），所以不会误跑 sync-packages、不动 packages.json。
      # ★ 固定文件名 + --clobber：链接永远不变，侧载商店可以长期填同一个地址。
      - name: Publish to ipa-test channel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_test && !inputs.nojvm }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA=$(ls artifacts/Meow-unsigned-*.ipa | grep -v nojvm | head -1)
          test -n "$IPA"
          cp "$IPA" artifacts/Meow-unsigned-test.ipa
          # 源清单要用的构建 metadata：版本号取刚构建的 CFBundleShortVersionString，
          # CI 不另编版本号 —— SideStore 默认开启版本校验（isAppVersionVerificationEnabled），
          # 源里写什么，下载完就要求 IPA 里的版本完全一致。
          SIZE=$(stat -f%z artifacts/Meow-unsigned-test.ipa)
          SHA=$(shasum -a 256 artifacts/Meow-unsigned-test.ipa | awk '{print $1}')
          printf '{"version":"%s","size":%s,"sha256":"%s","date":"%s"}\n' \
            '${{ steps.ver.outputs.version }}' "$SIZE" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/Meow-unsigned-test.json
          if ! gh release view ipa-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ipa-test --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" \
              --title "iOS 测试包（临时）" \
              --notes "手动 dispatch 的未签名测试 IPA。固定文件名 Meow-unsigned-test.ipa，每次覆盖；正式版见 release-v*。"
          fi
          gh release upload ipa-test artifacts/Meow-unsigned-test.ipa artifacts/Meow-unsigned-test.json \
            --repo "$GITHUB_REPOSITORY" --clobber
