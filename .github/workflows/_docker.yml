# 可复用工作流：构建并推送 Docker 三镜像。
#
# 两个入口：
#   · release.yml 通过 workflow_call 调用（全量发版 / "只发镜像"）
#   · Actions 页面手动 Run workflow（workflow_dispatch）：默认 dry_run=只构建不推送；
#     version 留空读 client/package.json；没有 web-dist artifact 时本地兜底构建前端。
#
# ## 为什么独立成文件
#
# Docker 是最常单独重发的链路（改了后端/前端但版本号不变、或 Registry 某次推送失败）。
# 拆出来后它能被「只发镜像」的入口直接调用，不必连带跑 15 分钟的 PC 构建。

name: _docker

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        description: 是否同时更新 latest 标签
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  # 手动入口（2026-11-25 补）：与 _plugins / fpk 对齐，可以在 Actions 页面单跑。
  # 默认 dry_run=true，只构建不推送 —— 想真推时把 dry_run 取消勾选。
  # latest 手动默认 false：重发同版本镜像时不应该顺手把 latest 挪过去。
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空读 client/package.json）'
        required: false
        type: string
      latest:
        description: '是否同时更新 latest 标签（手动默认 false）'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '只构建不推送（演练；默认 true）'
        required: false
        type: boolean
        default: true
      # ★ 手动强制重打运行时镜像（2026-11-28 补）：
      #   自动判据只看「自上个 release tag 起的改动」，补不上**历史欠账** ——
      #   实测 meow-pyrt 停在 0.1.0（2026-11-26 推），而 1.2.27 的 pyrt 修复
      #   已在 1.2.28 的 tag 里，差集里看不到它。补一次历史欠账时勾这两个。
      rebuild_pyrt:
        description: '强制重打 pyrt 镜像（补历史欠账用）'
        required: false
        type: boolean
        default: false
      rebuild_drpy:
        description: '强制重打 drpy 镜像'
        required: false
        type: boolean
        default: false

jobs:
  docker:
    name: Docker 三镜像
    runs-on: ubuntu-latest
    # 防止卡死烧满 6 小时默认上限（= 360 分钟额度）
    timeout-minutes: 30
    # ★ DOCKER_HUB_TOKEN 建在 Environment「dockerhub」下，不是仓库级。
    #   environment 级 secret 只有在 job 声明了同名 environment 时才可见；
    #   漏了会报 "Password required"（实测踩过）。
    environment: dockerhub
    steps:
      # fetch-depth: 0 —— 下面「运行时镜像是否需要重打」要 git diff 上一个 release tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # ★ 运行时镜像重建判据（2026-11-28 补）：
      #   build-push-docker.ps1 对 drpy/pyrt 是「tag 已存在就跳过」，而它们的 tag 是
      #   独立版本线（drpy 0.9.x / pyrt 0.1.x）。只要版本号没 bump，「跳过」就永远
      #   命中 —— 实测：meow-pyrt 至今只有 0.1.0（2026-11-26 推），而 server/pyrt/pyrt.py
      #   在 11-27 改过（探测不再持锁），Docker 用户拿不到这个修复。
      #   这里按「自上一个 release tag 以来这些路径有没有改动」决定强制重建，
      #   版本号不用为了发镜像而硬 bump。
      - name: 判断运行时镜像是否需要重打
        id: rt
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet origin 2>/dev/null || true
          CUR_TAG=$(git tag --points-at HEAD --list 'release-v*' | head -1)
          if [ -n "$CUR_TAG" ]; then
            PREV=$(git tag --sort=-v:refname --list 'release-v*' | grep -vx "$CUR_TAG" | head -1 || true)
            TARGET="$CUR_TAG"
          else
            PREV=$(git tag --sort=-v:refname --list 'release-v*' | head -1 || true)
            TARGET=HEAD
          fi
          # 没有基线（首个 tag）→ 两个都重建，宁可多打。
          changed() {
            [ -z "$PREV" ] && return 0
            ! git diff --quiet "$PREV" "$TARGET" -- "$@"
          }
          if changed server/pyrt deploy/docker/Dockerfile.pyrt; then PYRT=1; else PYRT=0; fi
          if changed server/drpy deploy/docker/Dockerfile.drpy; then DRPY=1; else DRPY=0; fi
          echo "pyrt=$PYRT" >> "$GITHUB_OUTPUT"
          echo "drpy=$DRPY" >> "$GITHUB_OUTPUT"
          echo "运行时镜像重建：pyrt=$PYRT drpy=$DRPY（基线 ${PREV:-无} → ${TARGET}）"

      - name: 登录 Docker Hub
        # 手动 dry-run 不需要登录（也不写 registry 缓存）；workflow_call 没有该输入 → 视为 false
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          # 不用 env.*：login-action 的 with 里取 job-level env 不稳
          username: chrplus
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # web 镜像用宿主预构建 dist（--target runtime-dist）：比容器内 pnpm 快，
      # 且不受容器无 TTY 影响。dist 由 release.yml 的 web job 统一构建
      # （同一次 run 的 artifact），这里不再自己跑一遍 pnpm。
      # 手动 dispatch 没有同 run 的 artifact → continue-on-error 后本地兜底构建。
      # ★ 只有 dispatch 才兜底：发版链（workflow_call）里 web job 失败必须硬失败，
      #   不能悄悄改用本地构建的 dist 继续发。
      - name: 取前端 dist
        id: webdist
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: client/apps/web/dist

      - name: 准备 pnpm（兜底构建前端用）
        if: github.event_name == 'workflow_dispatch' && steps.webdist.outcome != 'success'
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: 准备 node（兜底构建前端用）
        if: github.event_name == 'workflow_dispatch' && steps.webdist.outcome != 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: 兜底构建前端（手动 dispatch 没有 web-dist artifact）
        if: github.event_name == 'workflow_dispatch' && steps.webdist.outcome != 'success'
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @meow/web build

      # ★ Dockerfile.apiserver 有一句 `COPY server/build/dist/ ./build/dist/`，
      #   而**源目录不存在时 Docker 的 COPY 会直接 lstat 失败**（不是静默跳过）：
      #       ERROR: failed to build: lstat /server/build/dist: no such file or directory
      #
      #   2026-10-29 那次 `release-v0.9.37` 就挂在这里：三条链里只有 docker 红，
      #   publish 因为要求三条全 success 被整条跳过 → packages.json 从未更新 →
      #   客户端一直"检查更新说已是最新"。一个目录缺失能静默废掉整条发版链。
      #
      #   仓库里已常驻 `server/build/dist/.gitkeep`，但 git 的目录忽略规则很容易
      #   在某次改 .gitignore 时把它一起吞掉。这里再兜一层：目录不在就建出来，
      #   让构建不依赖"那个占位文件有没有被正确跟踪"。
      # 预编译 class（来自同一次 run 的插件 job）。没有也能构建：Dockerfile 里
      # prebuilt 目录为空时会回退镜像内 javac，只是 arm64 那层会慢 ~160s。
      - name: 取预编译 classes（可选）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apiserver-classes
          path: deploy/docker/prebuilt-classes

      - name: 确保 server/build/dist 存在（Dockerfile COPY 的硬要求）
        shell: bash
        run: |
          mkdir -p server/build/dist
          if [ -z "$(ls -A server/build/dist)" ]; then
            echo "dist 为空：镜像只带占位文件（Android 侧需另行获取 dex jar）"
            touch server/build/dist/.gitkeep
          else
            echo "dist 内容："
            ls -la server/build/dist
          fi

      # 手动 dispatch 时 version 可以留空：统一在这里解析一次，后面的构建与汇总都用它。
      - name: 解析版本
        id: v
        shell: bash
        run: |
          v='${{ inputs.version }}'
          if [ -z "$v" ]; then
            v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' client/package.json | head -1)
          fi
          [ -n "$v" ] || { echo "读不到版本号" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本：$v"

      - name: 构建并推送
        shell: pwsh
        run: |
          # 用 hashtable splatting：数组里含逗号的 'linux/amd64,linux/arm64'
          # 会被 pwsh 拆成两个位置参数（实测踩过）
          $p = @{
            User        = 'chrplus'
            Version     = '${{ steps.v.outputs.version }}'
            Platforms   = 'linux/amd64,linux/arm64'
            WebFromDist = $true
            # registry：缓存推到 <镜像>:buildcache，不吃 GitHub 缓存配额、跨版本可复用
            Cache       = 'registry'
          }
          if ('${{ inputs.latest }}' -eq 'false') { $p.NoLatest = $true }
          # 运行时载荷有改动 → 强制重建（否则「tag 已存在」会一直跳过，见上一步注释）
          if ('${{ steps.rt.outputs.pyrt }}' -eq '1') { $p.RebuildPyrt = $true }
          if ('${{ steps.rt.outputs.drpy }}' -eq '1') { $p.RebuildDrpy = $true }
          # 手动强制（补历史欠账；只对 dispatch 有意义，release 调用恒为空）
          if ('${{ inputs.rebuild_pyrt }}' -eq 'true') { $p.RebuildPyrt = $true }
          if ('${{ inputs.rebuild_drpy }}' -eq 'true') { $p.RebuildDrpy = $true }
          # 手动入口默认 dry-run：只构建不推送，先确认能过再取消勾选。
          # ★ 同时把 Cache 置空：--cache-to type=registry 本身也是一次推送，
          #   dry-run 不该往 Docker Hub 写 :buildcache。
          if ('${{ inputs.dry_run }}' -eq 'true') {
            $p.DryRun = $true
            $p.Cache = ''
          }
          ./deploy/scripts/build-push-docker.ps1 @p

      - name: 汇总镜像清单
        shell: bash
        run: |
          if [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo "### 镜像构建完成（dry-run：未推送）" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 镜像已推送" >> $GITHUB_STEP_SUMMARY
          fi
          for r in web apiserver drpy; do
            echo "- \`chrplus/meow-$r:${{ steps.v.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          done
