name: release

# 公开壳发布：只构建不依赖源包的产物（Web/PC/TV/iOS/apiserver 插件）。
# 真实 config / spider jar / payload 不在公开库，也不进 Release。
# iOS 产的是**未签名** IPA（端内 OpenJDK Zero，GPL-2.0+CE），只能侧载。
on:
  push:
    tags:
      - 'release-v[0-9]*'
      - 'tv-v[0-9]*'
      - 'pc-v[0-9]*'
      - 'plugins-v[0-9]*'
      - 'tv-plugins-v[0-9]*'
      - 'docker-v[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空读 client/package.json）'
        required: false
        type: string
      # 手动入口按链勾选（2026-11-25 补）：以前 dispatch 写死 tv/pc/ios/plugins 全跑，
      # 想单独验一条也做不到。默认 true = 保持原行为；全不勾会被 plan 判错。
      # 不提供 fpk / release：fpk 走自己的 dispatch；建 Release 只允许 tag 触发。
      tv:
        description: 'TV APK'
        required: false
        type: boolean
        default: true
      pc:
        description: 'PC 壳'
        required: false
        type: boolean
        default: true
      ios:
        description: 'iOS IPA'
        required: false
        type: boolean
        default: true
      plugins:
        description: 'PC 插件（4 个）'
        required: false
        type: boolean
        default: true
      docker:
        description: '构建并推送 DockerHub 三镜像'
        required: false
        type: boolean
        default: true
      tv_plugins:
        description: '构建 TV 运行时模块（3 ABI）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: 判定范围
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tv: ${{ steps.scope.outputs.tv }}
      pc: ${{ steps.scope.outputs.pc }}
      ios: ${{ steps.scope.outputs.ios }}
      plugins: ${{ steps.scope.outputs.plugins }}
      # release 全量走 buildset（apiserver + 有改动的插件）；单链沿用 scope 的值
      plugins_only: ${{ steps.buildset.outputs.plugins_only || steps.scope.outputs.plugins_only }}
      # 本次实际构建的插件（守卫 id），供 publish 的版本守卫使用
      guard: ${{ steps.buildset.outputs.guard }}
      docker: ${{ steps.scope.outputs.docker }}
      tvplugins: ${{ steps.buildset.outputs.tvplugins || steps.scope.outputs.tvplugins }}
      # 模块补丁号 = 壳补丁号（1.2.23 → 23），让模块版本跟上壳（18.20.4.23 / 0.1.23）
      patch_version: ${{ steps.buildset.outputs.patch_version }}
      tv_python_version: ${{ steps.buildset.outputs.tv_python_version }}
      tv_node_version: ${{ steps.buildset.outputs.tv_node_version }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 读版本号
        id: v
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(node -p "require('./client/package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"
      - name: tag 与版本号一致
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.v.outputs.version }}"
          # 版本域不同：壳/全量 tag 必须等于 package.json；
          # 模块与插件是独立版本线，tag 后缀不要求等于壳版本。
          case "$TAG" in
            tv-plugins-v[0-9]*) EXPECT="" ;;
            plugins-v[0-9]*)    EXPECT="" ;;
            *)                  EXPECT="${TAG##*-v}" ;;
          esac
          if [ -n "$EXPECT" ] && [ "$EXPECT" != "$VER" ]; then
            echo "::error::tag=$TAG 里的版本($EXPECT) 与 package.json 的 $VER 不一致"
            exit 1
          fi
      - name: 版本一致性
        shell: pwsh
        run: ./deploy/scripts/bump-version.ps1 -Check
      - name: 解析范围
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          set_out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            set_out tv '${{ inputs.tv }}'; set_out pc '${{ inputs.pc }}'
            set_out ios '${{ inputs.ios }}'; set_out plugins '${{ inputs.plugins }}'
            set_out release false
            set_out plugins_only ''
            set_out docker '${{ inputs.docker }}'; set_out tvplugins '${{ inputs.tv_plugins }}'
            # 全不勾 = 什么都没产出，直接判错，别让人等一个空 run
            if [ '${{ inputs.tv }}' != "true" ] && [ '${{ inputs.pc }}' != "true" ] \
               && [ '${{ inputs.ios }}' != "true" ] && [ '${{ inputs.plugins }}' != "true" ] \
               && [ '${{ inputs.docker }}' != "true" ] && [ '${{ inputs.tv_plugins }}' != "true" ]; then
              echo "::error::至少勾选一条链（tv / pc / ios / plugins / docker / tv_plugins）"
              exit 1
            fi
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            release-v[0-9]*)    set_out tv true;  set_out pc true;  set_out ios true;  set_out plugins true;  set_out docker true;  set_out tvplugins false; set_out release true;  set_out plugins_only '' ;;
            tv-v[0-9]*)         set_out tv true;  set_out pc false; set_out ios false; set_out plugins false; set_out docker false; set_out tvplugins false; set_out release true;  set_out plugins_only apiserver ;;
            pc-v[0-9]*)         set_out tv false; set_out pc true;  set_out ios false; set_out plugins true;  set_out docker false; set_out tvplugins false; set_out release true;  set_out plugins_only apiserver ;;
            plugins-v[0-9]*)    set_out tv false; set_out pc false; set_out ios false; set_out plugins true;  set_out docker false; set_out tvplugins false; set_out release true;  set_out plugins_only '' ;;
            tv-plugins-v[0-9]*) set_out tv false; set_out pc false; set_out ios false; set_out plugins false; set_out docker false; set_out tvplugins true;  set_out release true;  set_out plugins_only '' ;;
            # ★ 只重建 Docker 三镜像（2026-11-12 补回）：不建 GitHub Release、不改 packages.json。
            docker-v[0-9]*)     set_out tv false; set_out pc false; set_out ios false; set_out plugins false; set_out docker true;  set_out tvplugins false; set_out release false; set_out plugins_only '' ;;
            *) echo "::error::无法识别的 tag：$TAG"; exit 1 ;;
          esac

      # ★ release 全量只构建「后端 + 有源码改动的插件」，未改动的从上一版 Release 继承
      #   （2026-11-26 用户口径：插件/模块基本不变更，不该每版重发 150MB）。
      #   继承源缺失（如新插件 pyrt 从未进过任何 Release）时自动加入构建，保证自包含。
      - name: 计算构建范围（release 全量）
        id: buildset
        if: startsWith(github.ref, 'refs/tags/release-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$(bash ./deploy/scripts/detect-changed-plugins.sh "$GITHUB_REF_NAME")"
          CHANGED="$(printf '%s\n' "$OUT" | sed -n 's/^changed=//p')"
          PREV="$(printf '%s\n' "$OUT" | sed -n 's/^prev=//p')"
          # PC 插件链（tv-node / tv-python 归 tv-plugins 链，不在这里构建）
          PCS=""
          for id in $(echo "$CHANGED" | tr ',' ' '); do
            case "$id" in tv-node|tv-python) continue ;; esac
            case ",$PCS," in *",$id,"*) continue ;; esac
            PCS="${PCS:+$PCS,}$id"
          done
          # 继承源检查：上一版正式 Release 里没有该插件资产 → 必须本次构建
          ASSETS=""
          if [ -n "$PREV" ]; then
            ASSETS="$(gh release view "$PREV" --json assets -q '.assets[].name' 2>/dev/null || true)"
          fi
          asset_prefix() {
            case "$1" in
              danmu) echo danmu-api ;;
              *)     echo "$1" ;;
            esac
          }
          for id in danmu drpy ffmpeg pyrt; do
            case ",$PCS," in *",$id,"*) continue ;; esac
            p="$(asset_prefix "$id")"
            if [ -n "$ASSETS" ] && printf '%s\n' "$ASSETS" | grep -q "^${p}-"; then continue; fi
            echo "::notice::${id} 在 ${PREV:-上一版} 里没有资产，本次强制构建"
            PCS="${PCS:+$PCS,}$id"
          done
          ONLY="apiserver${PCS:+,$PCS}"

          # ── 运行时模块（tv-node / tv-python）─────────────────────────
          # 构建条件：有源码改动，或继承源里根本没有该模块（如 tv-python 首秀）。
          # 两者都无 → 继承旧版，不构建（模块版本号才不会被白涨）。
          TVPLUGINS=false
          for id in tv-node tv-python; do
            case ",$CHANGED," in
              *",$id,"*) TVPLUGINS=true; echo "::notice::${id} 有源码改动，本次构建模块" ;;
            esac
            if [ -n "$ASSETS" ] && printf '%s\n' "$ASSETS" | grep -q "^${id}-"; then
              :
            else
              TVPLUGINS=true; echo "::notice::${id} 在 ${PREV:-上一版} 里没有资产，本次强制构建"
            fi
          done

          # 守卫只看本次真的构建的插件（apiserver 版本跟壳走，守卫内会跳过）
          GUARD=""
          for id in $(echo "$ONLY" | tr ',' ' '); do
            [ "$id" = apiserver ] && continue
            g="$id"; [ "$id" = danmu ] && g="danmu-api"
            GUARD="${GUARD:+$GUARD,}$g"
          done
          [ "$TVPLUGINS" = "true" ] && GUARD="${GUARD:+$GUARD,}tv-node,tv-python"

          # 壳补丁号：1.2.23 → 23（模块版本用它：18.20.4.23 / 0.1.23）
          PATCH="${GITHUB_REF_NAME##*.}"

          echo "plugins_only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "guard=$GUARD" >> "$GITHUB_OUTPUT"
          echo "tvplugins=$TVPLUGINS" >> "$GITHUB_OUTPUT"
          echo "patch_version=$PATCH" >> "$GITHUB_OUTPUT"
          # ── 模块版本（v1.3.0 改版）─────────────────────────────────
          # 旧方案 0.1.<壳补丁> 在 minor 进位时倒退（1.3.0 → 0.1.0 < 0.1.24），
          # 客户端按版本号判定"已是最新"就永远升不上去。改成随 app 版本单调：
          #   tv-python 0.<次段>.<修订>      1.3.0 → 0.3.0
          #   tv-node   18.20.4.<次段*100+修订>  1.3.0 → 18.20.4.300
          # 边界：app 大版本进位（2.0.0）时 node/Chaquopy 基座本身会升级，
          # 连基座一起 bump 即恢复单调 —— 到时候记得同步改这里和守卫。
          VER_BODY="${GITHUB_REF_NAME#release-v}"
          IFS='.' read -r _MA _MI _PA <<< "$VER_BODY"
          echo "tv_python_version=0.${_MI}.${_PA}" >> "$GITHUB_OUTPUT"
          echo "tv_node_version=18.20.4.$(( _MI * 100 + _PA ))" >> "$GITHUB_OUTPUT"
          echo "构建范围：plugins=$ONLY tvplugins=$TVPLUGINS patch=$PATCH（自 ${PREV:-无} 起改动：${CHANGED:-无}）"

  web:
    name: Web dist
    needs: plan
    if: ${{ needs.plan.outputs.tv == 'true' || needs.plan.outputs.pc == 'true' || needs.plan.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: 构建 web
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @meow/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: client/apps/web/dist
          if-no-files-found: error

      # ── fnOS fpk 用的那份 dist（2026-11-13）──────────────────────────
      # fpk 的 web 必须挂在 /app/meow/ 子路径下（base + VITE_API_BASE 都是编译期
      # 常量），和上面那份不是同一份产物，所以 fpk 以前在自己两条矩阵腿里各建
      # 一次 —— 全量里最后一段"三处重复"（见 _tv.yml:68 的同款注释）。
      # 现在在这里顺手多产一份，fpk 两腿直接下载复用。
      # ★ 只在全量 tag 上建：tv-v*/pc-v*/docker-v* 不需要它，不许多花这 40 秒。
      - name: 构建 web（fpk 版，/app/meow base，仅全量）
        if: ${{ startsWith(github.ref, 'refs/tags/release-v') }}
        working-directory: client
        run: |
          set -euo pipefail
          # typecheck 上面刚跑过（build = vue-tsc && vite build），这里只出产物
          VITE_API_BASE=/app/meow pnpm --filter @meow/web exec vite build \
            --base=/app/meow/ --outDir dist-fpk
          test -f apps/web/dist-fpk/index.html
          # 自检：base 必须真的落到 index.html 里，否则 fpk 端白屏
          grep -q '/app/meow/' apps/web/dist-fpk/index.html
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/release-v') }}
        with:
          name: web-dist-fpk
          path: client/apps/web/dist-fpk
          if-no-files-found: error

  tv:
    name: TV APK
    needs: [plan, web]
    if: ${{ needs.plan.outputs.tv == 'true' }}
    uses: ./.github/workflows/_tv.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  pc:
    name: PC 壳
    needs: [plan, web]
    if: ${{ needs.plan.outputs.pc == 'true' }}
    uses: ./.github/workflows/_pc_shell.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  docker:
    name: Docker 三镜像
    # ★ 必须等 plugins（2026-11-17 补）：apiserver 镜像要复用插件 job 上传的
    #   `apiserver-classes`，省掉 arm64 在 QEMU 里的 javac（实测那一层 162.7s）。
    #   原来只 needs: [plan, web] → 两者并行起跑，artifact 还不存在，
    #   download 静默失败并回退镜像内编译 —— 优化等于没做（接线检查出来的）。
    #   plugins 被跳过时（docker-v* 只重发镜像）用 result != 'failure' 放行，
    #   此时退回镜像内 javac，行为与以前一致。
    needs: [plan, web, plugins]
    # ★ web 必须成功（2026-11-25 补）：本 job 用 !cancelled()（为了 plugins 失败也能跑），
    #   而手动 dispatch 时 _docker 允许"没有 web-dist 就本地构建前端"的兜底。
    #   两个条件叠加会让「web 失败」被本地构建掩盖、还照样推镜像。
    #   tag 发版没有兜底（event≠dispatch）本来就会失败，这里把两条路统一成硬失败。
    if: ${{ !cancelled() && needs.plan.outputs.docker == 'true' && needs.web.result == 'success' && needs.plugins.result != 'failure' }}
    uses: ./.github/workflows/_docker.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      # ★ 默认 true；预览验证期把仓库变量 MEOW_PUSH_LATEST 设为 false，
      #   只推版本号镜像、不动 docker:latest（避免验证版被所有用户拉到）。
      latest: ${{ vars.MEOW_PUSH_LATEST != 'false' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  tv_plugins:
    name: TV 运行时模块
    needs: plan
    if: ${{ needs.plan.outputs.tvplugins == 'true' }}
    uses: ./.github/workflows/_tv_plugins.yml
    with:
      # 模块补丁号跟壳走（1.2.23 → 23）：tv-node 18.20.4.23 / tv-python 0.1.23
      patch_version: ${{ needs.plan.outputs.patch_version }}
      # v1.3.0 起：模块版本随 app 版本单调（0.1.<补丁> 在 minor 进位时倒退）
      tv_python_version: ${{ needs.plan.outputs.tv_python_version }}
      tv_node_version: ${{ needs.plan.outputs.tv_node_version }}
    secrets: inherit

  # ── iOS 未签名 IPA（2026-11-24 接入）────────────────────────────────────
  # 端内 OpenJDK 9 Zero + 同一份 ApiServer：主线现在带 iOS 工程，
  # 全量发版要像 TV/PC 一样有 IPA，不再靠 feat/ios-jvm 的 push 单独出包。
  # 只跑全量（release-v*）与手动 dispatch；tv-v*/pc-v* 等单链不带，
  # 因为 macOS runner 计时按 2× 算，不该为不带 iOS 的发版付这笔。
  # 产物名 Meow-unsigned-*.ipa（另留固定名 Meow-unsigned.ipa）由 publish 的 `*.ipa` 收进主 Release。
  ios:
    name: iOS IPA
    needs: plan
    if: ${{ needs.plan.outputs.ios == 'true' }}
    uses: ./.github/workflows/_ios.yml
    with:
      # 把 plan 解析出的版本传进去：IPA 的 CFBundleShortVersionString 以它为准
      # （Info.plist 里那份由 bump-version 维护，双保险；漏 bump 也不会发错版本）
      version: ${{ needs.plan.outputs.version }}
      sim: false
      nojvm: false
    secrets: inherit

  plugins:
    name: 插件
    needs: plan
    if: ${{ needs.plan.outputs.plugins == 'true' }}
    uses: ./.github/workflows/_plugins.yml
    with:
      plugins_only: ${{ needs.plan.outputs.plugins_only }}

  # ── fnOS fpk（2026-11-13 补）────────────────────────────────────────────
  # 用户报：release-v* 全量发版**没有 fpk**，Release 缺资产、FnDepot 也没更新。
  # 现在全量链直接调 fpk.yml（workflow_call）：
  #   · 只构建，产物由下面的 publish 收进主 Release（和 TV/PC 同页）
  #   · 索引等 Publish 之后由 fpk.yml 的 index-after-publish 写
  #     （FnDepot 正式源 + fpk-updates 镜像），与 sync-packages 同一时机
  #   · 仍保留 fpk-v* 单链 —— 只补 fpk 时不用重跑 Docker/TV/PC
  # 只在全量 tag 上跑：tv-v/pc-v/plugins-v 这些单链不带 fpk。
  fpk:
    name: fnOS fpk
    # ★ 必须等 web（2026-11-13 实测）：fpk 两腿要复用 web 的 /app/meow 版 dist。
    #   原来只 needs: plan → 腿在 +20s 起跑，而 web 到 +54s 才上传 artifact，
    #   下载步骤必然扑空并静默回落自建（日志「没有可复用的 dist → 自行构建」），
    #   等于两条腿各多跑一遍 pnpm install + typecheck + vite。
    needs: [plan, web]
    if: ${{ github.event_name == 'push' && needs.plan.outputs.release == 'true'
            && startsWith(github.ref, 'refs/tags/release-v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/fpk.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      mirror_tag: fpk-v${{ needs.plan.outputs.version }}
    secrets:
      FNDEPOT_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}

  publish:
    name: 建 draft Release
    # ★ fpk 也进 needs（2026-11-13 用户口径）：全量 Release 必须自带 fnOS 包，
    #   不另出 fpk-v* Release —— 用户下载/归档只认一个 Release，
    #   和 TV/PC 的包同级。副作用：fpk 失败 = 这轮不建 Release（和 web/tv/pc 同语义）。
    # ★ ios 同样进 needs（2026-11-24）：全量发版必须带未签名 IPA，失败同样不建 Release。
    needs: [plan, web, tv, pc, ios, plugins, docker, tv_plugins, fpk]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.release == 'true'
            && needs.web.result != 'failure' && needs.web.result != 'cancelled'
            && needs.tv.result != 'failure' && needs.tv.result != 'cancelled'
            && needs.pc.result != 'failure' && needs.pc.result != 'cancelled'
            && needs.ios.result != 'failure' && needs.ios.result != 'cancelled'
            && needs.plugins.result != 'failure' && needs.plugins.result != 'cancelled'
            && needs.docker.result != 'failure' && needs.docker.result != 'cancelled'
            && needs.tv_plugins.result != 'failure' && needs.tv_plugins.result != 'cancelled'
            && needs.fpk.result != 'failure' && needs.fpk.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0：下面的「插件版本守卫」要 git diff 上一个 release tag，
      # 默认的浅克隆拿不到历史，diff 会静默为空（= 守卫失效）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 整理目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          # ★ 含 .fpk：全量时 fpk job 的 artifact（fpk-x86 / fpk-arm）也在这个 run 里，
          #   fnOS 包跟 TV/PC 的包同级放主 Release（2026-11-13 用户口径）。
          #   单链 tv-v*/pc-v* 等没有 fpk artifact，find 不会命中，行为不变。
          # ★ 含 .ipa（2026-11-24）：iOS job 上传 ios-ipa-<run>，同样进主 Release。
          find dist -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' -o -name '*.fpk' -o -name '*.ipa' \) -exec cp {} upload/ \; || true
          # 固定名副本（2026-11-25 用户口径）：侧载工具按 URL 直接装，
          # latest/download 必须精确文件名、版本化名字每版都变 → 额外留一份 Meow-unsigned.ipa。
          # 跳过 nojvm 变体（排障用，不该覆盖标准包）。
          for f in upload/Meow-unsigned-*.ipa; do
            [ -e "$f" ] || continue
            case "$f" in *-nojvm-*) continue ;; esac
            cp "$f" upload/Meow-unsigned.ipa
            break
          done
          ls -la upload
          # 公开壳发布守卫：绝不允许源包混进 Release
          # （.ipa 里也不该有：iOS 载荷只有 host.jar + danmu-api 运行时，仍在 IP 外）
          if find upload -type f \( -name 'spider*.jar' -o -name 'config.sites.json' -o -name 'node-payload-danmu.zip' \) | grep -q .; then
            echo "::error::公开 Release 里出现源包文件"; exit 1
          fi
      # ★ 继承上一版资产（2026-11-26）：release 全量只构建壳 + 后端 + 有改动的插件，
      #   未改动的插件/运行时模块从上一个正式 Release 原样复制，保证 Release 自包含。
      #   判断按「资产前缀」：upload/ 里已有同前缀 = 本次构建过，不覆盖
      #   （版本号不同，文件名不会同名；同前缀不同版本时保留本次的新文件）。
      - name: 继承上一版资产（本次未构建的插件/模块）
        # ★ 只在全量 release-v* 跑：单链（tv-v*/pc-v*/plugins-v*/tv-plugins-v*）同样会建
        #   Release，但产物只有本链一两件；继承全量资产会把单链 Release 塞满
        #   （2026-11-26 核对发版规律时补的门槛）。
        if: startsWith(github.ref, 'refs/tags/release-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ★ 含 pre-release（2026-11-26）：预发版的资产也要能被下一版继承，
          #   否则「先放 Pre-release」带的新插件（如 pyrt）每次都要重建。
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '[.[] | select(.draft == false and (.tag_name|startswith("release-v")))]
                | sort_by(.created_at) | .[-1].tag_name' 2>/dev/null || true)
          if [ -z "${PREV:-}" ]; then echo "::warning::找不到上一版正式 Release，跳过继承"; exit 0; fi
          echo "继承源：$PREV"
          prefix_of() {
            case "$1" in
              tv-node-*)   echo tv-node ;;
              tv-python-*) echo tv-python ;;
              danmu-api-*) echo danmu-api ;;
              apiserver-*) echo apiserver ;;
              drpy-*)      echo drpy ;;
              ffmpeg-*)    echo ffmpeg ;;
              pyrt-*)      echo pyrt ;;
              node-*)      echo node ;;
              *)           echo "" ;;
            esac
          }
          # ★ 先算出「本次构建过的前缀集合」再判断，不能边下边 compgen：
          #   同一前缀可能对应多个资产（tv-node 三个 ABI），下载第一个后 compgen
          #   就命中，后两个会被误判「本次已构建」跳过（2026-11-26 实测只剩 arm64）。
          BUILT=""
          for f in upload/*; do
            [ -e "$f" ] || continue
            bp="$(prefix_of "$(basename "$f")")"
            [ -n "$bp" ] && BUILT="$BUILT $bp"
          done
          BUILT=" $(echo $BUILT | tr ' ' '\n' | sort -u | tr '\n' ' ') "

          while IFS= read -r name; do
            [ -z "$name" ] && continue
            p="$(prefix_of "$name")"
            [ -n "$p" ] || continue
            case "$BUILT" in
              *" $p "*) echo "本次已构建 ${p}，跳过 $name"; continue ;;
            esac
            echo "继承 $name"
            gh release download "$PREV" -p "$name" -D upload/ --clobber
          done < <(gh release view "$PREV" --json assets -q '.assets[].name')
          ls -la upload

      - name: 生成 SHA256
        shell: bash
        working-directory: upload
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" -gt 0 ] && sha256sum * > SHA256SUMS.txt

      # ── 插件版本守卫（2026-11-13）───────────────────────────────────────
      # 背景：danmu-api / drpy / ffmpeg 的版本手写在 manifest，tv-node 的补丁号
      # 依赖本地状态（CI 恒为 .1）。改了载荷忘了升版本 = 客户端按版本号判定
      # 「已是最新」→ 新内容永远发不出去，而 CI 全绿（1.2.4/1.2.5 的 tv-node 就这样过）。
      # 判据用**源码 diff**而不是 zip 的 sha：zip 带时间戳，重跑一次 sha 就变，
      # 拿 sha 判会在每次重跑时误报。
      - name: 计算本版有源码改动的插件单元
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CUR="${GITHUB_REF_NAME}"
          # 确保 tag 都在本地：checkout 的 fetch-depth:0 只保证历史，tag 不一定带过来；
          # 拿不到 PREV 时守卫会跳过（不误拦，但等于没守）。
          git fetch --tags --force --quiet origin 2>/dev/null || true
          PREV=""
          while read -r t; do
            [ -z "$t" ] && continue
            [ "$t" = "$CUR" ] && continue
            if git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then PREV="$t"; break; fi
          done < <(git tag -l 'release-v*' --sort=-v:refname)

          CHANGED=""
          add() { CHANGED="${CHANGED:+$CHANGED,}$1"; }
          if [ -n "$PREV" ]; then
            # ★ 不要写 `git diff … | grep -q`：grep 提前退出会让 git 吃 SIGPIPE，
            #   pipefail 下整步失败（本项目踩过多次）。用命令替换判空。
            [ -n "$(git diff --name-only "$PREV"..HEAD -- server/drpy)" ] && add drpy
            [ -n "$(git diff --name-only "$PREV"..HEAD -- client/apps/tv/app/src/main/assets/node-payload-danmu.zip)" ] && add danmu-api
            [ -n "$(git diff --name-only "$PREV"..HEAD -- client/apps/tv/runtime-node client/apps/tv/app/src/main/assets/node-payload-danmu.zip)" ] && add tv-node
            [ -n "$(git diff --name-only "$PREV"..HEAD -- server/build-plugin-ffmpeg.ps1)" ] && add ffmpeg
          else
            echo "::warning::找不到上一个 release tag，插件版本守卫跳过"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "自 ${PREV:-（无）} 起有源码改动的插件单元：${CHANGED:-无}"

          # 基线：最近一个已发布、且带 packages.json 的 Release
          BASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            -q '[.[] | select(.draft == false and .prerelease == false
                 and ([.assets[].name] | index("packages.json")))] | .[0].tag_name' 2>/dev/null || true)
          if [ -n "${BASE_TAG:-}" ]; then
            gh release download "$BASE_TAG" -p packages.json -O baseline-packages.json --clobber \
              && echo "基线：$BASE_TAG" || echo "::warning::基线下载失败，守卫将跳过"
          else
            echo "::warning::找不到带 packages.json 的已发布 Release，守卫将跳过"
          fi

      - name: 插件版本守卫（改了源码必须升版本）
        shell: pwsh
        run: |
          ./deploy/scripts/check-plugin-versions.ps1 `
            -ChangedIds '${{ needs.plan.outputs.guard }}' `
            -Version '${{ needs.plan.outputs.version }}' `
            -BaselinePath 'baseline-packages.json'

      # ★ 更新说明进 Release 正文（2026-11-12 用户指出 1.2.0 页面上没有说明）。
      #   以前正文是纯静态资产表，用户只在应用内弹框里才看得到 CHANGELOG。
      #   解析口径与 fpk.yml 的「取更新说明」完全一致（`## <版本>` 小节）。
      - name: 取更新说明
        id: notes
        shell: bash
        env:
          VER: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(awk -v v="$VER" '
            /^##[[:blank:]]/ {
              h = $0
              sub(/^##[[:blank:]]+/, "", h)
              sub(/[[:blank:]]+$/, "", h)
              if (h == v || h == "[" v "]") { hit = 1; next }
              if (hit) exit
            }
            hit {
              t = $0
              gsub(/^[[:blank:]]+|[[:blank:]]+$/, "", t)
              if (t == "") next
              print t
            }
          ' CHANGELOG.md)"
          {
            echo "notes<<MEOW_EOF"
            echo "$NOTES"
            echo "MEOW_EOF"
          } >> "$GITHUB_OUTPUT"
      # ★ 清掉同名旧 draft（2026-11-26）：draft 按 tag 复用，早期失败轮上传的
      #   旧版本插件（实测 apiserver-1.2.22.zip / drpy-0.1.1.zip）会残留进最终 Release。
      - name: 清理同名旧 draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q '.isDraft' 2>/dev/null || echo missing)
          if [ "$IS_DRAFT" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
            echo "已删除旧 draft：$GITHUB_REF_NAME"
          else
            echo "没有可清理的旧 draft（状态：$IS_DRAFT）"
          fi

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: false
          files: upload/*
          body: |
            ## 更新说明

            ${{ steps.notes.outputs.notes }}

            ## 公开壳产物

            本 Release 只含空壳，不含 spider jar / 真实站点配置 / payload。
            安装后请在应用内导入自己的源包。

            | 文件 | 说明 |
            |---|---|
            | `meow-TV-*.apk` | TV 空壳 |
            | `tv-node-*.apk` | TV 运行时模块 |
            | `meow-setup-*.exe` / `meow-bare-*.exe` | PC 空壳 |
            | `apiserver-*.zip` | PC 后端插件 |
            | `drpy-*.zip` / `danmu-api-*.zip` / `node-*.zip` / `ffmpeg-*.zip` | PC 插件 |
            | `meow_*.fpk` | fnOS 套件（x86 / arm） |
            | `Meow-unsigned-*.ipa`（版本化）/ `Meow-unsigned.ipa`（固定名，始终指向最新） | iOS 空壳（未签名，需自签侧载 / LiveContainer） |
            | `packages.json` | 客户端更新清单 |
            | `altstore-source.json` | 侧载商店源（SideStore / LiveContainer / AltStore），每版一条 |
            | `SHA256SUMS.txt` | 校验 |

  sync-packages:
    name: 生成 packages.json
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && !startsWith(github.event.release.tag_name, 'fpk-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # 更新说明的 git-log 兜底范围终点是「main 最新」（sync-packages.ps1 的
      # Get-GitLogNotes 优先读 origin/main）。checkout ref: main 会建本地 main，
      # 但显式把 origin/main 也刷到最新，避免 checkout 的 refspec 细节导致回退到 HEAD。
      - name: 刷新 origin/main（更新说明范围终点）
        shell: bash
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: 生成并上传清单
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./deploy/scripts/sync-packages.ps1 -Tag $env:GITHUB_REF_NAME
