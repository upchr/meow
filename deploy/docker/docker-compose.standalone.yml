# 猫窝 Meow —— 独立编排（不用 clone 仓库，直接拉镜像启动）
#
# 用法：把这个文件存进任意空目录，然后
#   docker compose up -d
# 数据写在同目录的 ./data/（删掉目录 = 重置全部配置）。
#
# 所有参数都写成 ${VAR:-默认值}：默认不用改。要改就在同目录建 .env，
# 或临时加前缀，比如 WEB_PORT=30020 docker compose up -d。常用：
#   WEB_PORT=30010            前端端口（浏览器访问）
#   APISERVER_BIND=0.0.0.0    后端给 TV / 局域网直连（同时务必设 MEOW_AUTH_TOKEN）
#   MEOW_VERSION=<版本>       钉死镜像 tag（默认 latest：新机器直接拉最新发布）
#                             升级仍要 docker compose pull（up -d 不会重新拉已有镜像）
#   MEOW_DANMAKU_API=         置空 = 不用弹幕聚合服务
#   MEOW_AUTH_TOKEN=xxxx      写操作令牌（后端不只监听本机时建议设）
#
# 和仓库里的 docker-compose.yml 项目名、容器名一致（部署形态无缝切换）。
# 要带源服务启动，用仓库里的 with-sources 编排；完整说明见
# https://upchr.github.io/meow/guide/web-docker
#
# 停单个服务用 stop / start，不要 `docker compose down <服务名>`
# （down 会删共享网络，其他容器立即失去网络；删容器用 rm -sf）。

name: meow

# 容器日志轮转：json-file 默认不轮转，长跑/高分片请求会把盘写满。
# 10MB × 3 份：够排查，也不会无限增长。
x-logging: &meow-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"


services:
  apiserver:
    logging: *meow-logging
    image: ${APISERVER_IMAGE:-chrplus/meow-apiserver:${MEOW_VERSION:-latest}}
    container_name: meow-apiserver
    ports:
      # 默认只绑本机。要给 TV / 局域网直连改 APISERVER_BIND=0.0.0.0，
      # 并设置 MEOW_AUTH_TOKEN（暴露的不只是播放，还有写端点）。
      - "${APISERVER_BIND:-127.0.0.1}:${APISERVER_PORT:-30011}:9979"
    volumes:
      - ./data:/data
    environment:
      MEOW_DATA: /data
      MEOW_PORT: "9979"
      # 用 `-` 而非 `:-`：显式置空表示"不用这个服务"
      MEOW_JS_RUNTIME: ${MEOW_JS_RUNTIME-http://drpy:9330}
      # .py 源 → pyrt（宿主未配 pyRuntimeAddr 时回落 jsRuntime，兼容老单地址部署）
      MEOW_PY_RUNTIME: ${MEOW_PY_RUNTIME-http://pyrt:19331}
      MEOW_DANMAKU_API: ${MEOW_DANMAKU_API-http://danmu_api:9321}
      MEOW_AUTH_TOKEN: ${MEOW_AUTH_TOKEN-}
      MEOW_CORS: ${MEOW_CORS-*}
      # 片库「选择目录」能看到的根（冒号分隔）。不设 = 弹窗只提示未挂载，
      # 避免用户去填 /volume1/... 这种宿主机路径然后永远读不到。
      # 例：MEOW_LIBRARY_ROOTS=/media:/downloads（必须先 bind mount 进来）
      MEOW_LIBRARY_ROOTS: ${MEOW_LIBRARY_ROOTS-}
      JAVA_OPTS: ${APISERVER_JAVA_OPTS:--Xms64m -Xmx512m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8}
    restart: unless-stopped
    networks: [meow]

  web:
    logging: *meow-logging
    image: ${WEB_IMAGE:-chrplus/meow-web:${MEOW_VERSION:-latest}}
    container_name: meow-web
    ports:
      - "${WEB_PORT:-30010}:8080"
    environment:
      MEOW_APISERVER: ${MEOW_APISERVER:-http://apiserver:9979}
    restart: unless-stopped
    networks: [meow]

  # drpy 运行时（.js 源）。独立版本线，别跟 MEOW_VERSION 走。
  drpy:
    logging: *meow-logging
    image: ${DRPY_IMAGE:-chrplus/meow-drpy:${DRPY_VERSION:-0.9.26}}
    container_name: meow-drpy
    ports:
      - "127.0.0.1:${DRPY_PORT:-30013}:9330"
    environment:
      DRPY_PORT: "9330"
      DRPY_STRIP_REMOTE: "1"
      # 容器间互信：apiserver / pyrt 从 docker 网桥（172.x）过来，源地址永远不是回环。
      # ★ 安全性依赖上面的端口只绑 127.0.0.1 —— 否则 DNAT 会让局域网请求也显示成
      #   网桥地址（172.x.0.1），私有网段判定就变成"谁都能执行脚本"。
      DRPY_TRUST_PRIVATE: "1"
    restart: unless-stopped
    networks: [meow]

  # Python 源运行时（.py）：apiserver 通过 MEOW_PY_RUNTIME 指向它。
  # 独立版本线；没挂 py-scripts 卷时 .py 源会在调用时报 "py script not found"。
  pyrt:
    logging: *meow-logging
    image: ${PYRT_IMAGE:-chrplus/meow-pyrt:${PYRT_VERSION:-latest}}
    container_name: meow-pyrt
    ports:
      - "${PYRT_PORT:-30014}:19331"
    volumes:
      - ./data/py-scripts:/data/py-scripts
    environment:
      PYRT_PORT: "19331"
      PYRT_BIND: "0.0.0.0"
      PYRT_SCRIPTS: /data/py-scripts
      PYRT_DRPY: http://drpy:9330
    restart: unless-stopped
    networks: [meow]

  # 弹幕聚合（官方镜像，可不启；不启用就把 MEOW_DANMAKU_API 置空）
  danmu_api:
    logging: *meow-logging
    image: ${DANMU_API_IMAGE:-logvar/danmu-api:1.21.6}
    container_name: meow-danmu-api
    ports:
      - "${DANMU_BIND:-127.0.0.1}:${DANMU_API_PORT:-30012}:9321"
    volumes:
      - ./data/danmu:/app/config
    environment:
      DANMU_API_PORT: "9321"
      SOURCE_ORDER: ${DANMU_SOURCE_ORDER:-douban,360,renren,hanjutv,iqiyi,tencent,youku,bilibili}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9321/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [meow]

networks:
  meow:
    driver: bridge
