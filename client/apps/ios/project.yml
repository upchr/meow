name: Meow
options:
  bundleIdPrefix: com.meow.player
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_OBJC_ARC: YES
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_DEBUG_DYLIB: NO
    DEAD_CODE_STRIPPING: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # 真机包：带 OpenJDK 9 Zero（静态 libjvm.a）与端内 Java 宿主。
  Meow:
    type: application
    scheme:
      testTargets: []
    platform: iOS
    sources:
      - path: Meow
        excludes:
          - Info.plist
      - path: build/web
        type: folder
        buildPhase: resources
      - path: build/openjdk
        type: folder
        buildPhase: resources
      - path: build/jvm
        type: folder
        buildPhase: resources
      # 弹幕载荷（danmu_api，TV/PC 同一个 zip 解开）：首次启动拷到 Documents 再跑。
      # 40MB 左右；没有它时 NodeBridge 直接跳过，弹幕退回宿主内置源。
      - path: build/danmu-api
        type: folder
        buildPhase: resources
      # JS 源载荷（drpy）：iOS 用真 Node 跑 .js 源，与 PC/Docker 同一份源码。
      # 备料 scripts/prepare-drpy-payload.sh（未裁 19MB → 裁后 7.4MB）。
      - path: build/drpy
        type: folder
        buildPhase: resources
      # .py 源载荷（端内 CPython + pyrt）：备料 scripts/prepare-python-payload.sh。
      # 只把 runtime 目录当资源（framework 走 dependencies embed，否则重复 8MB）。
      - path: build/python/runtime
        type: folder
        buildPhase: resources
      # C 扩展模块必须进 Frameworks（侧载器只给它递归签名），见 prepare 脚本
      - path: build/python/pyext
        type: folder
        buildPhase:
          copyFiles:
            destination: frameworks
      - path: build/config.sites.example.json
        buildPhase: resources
    dependencies:
      # 端内 Node 运行时（nodejs-mobile，V8 关 JIT）。是**动态库**（CI 里 file 确认
      # 过 "dynamically linked shared library"），必须 embed，否则启动时 dyld 找不到。
      - framework: build/node/NodeMobile.framework
        embed: true
        codeSign: false
      # 端内 CPython（Python-Apple-support 3.12-b13，动态库）。embed 后
      # PythonRuntime 在后台线程 Py_Initialize 并执行 runtime/pyrt.py。
      - framework: build/python/Python.framework
        embed: true
        codeSign: false
      # 端内 VLCKit（MobileVLCKit 3.7.5，LGPLv2.1，动态库）。web 的 <video>
      # 播不了 MKV/AVI/FLV/DTS/10-bit 时的原生兜底，与 TV 的 openNative 同构。
      # iOS 不能 fork/exec，服务端 ffmpeg 那条路不存在 —— 这是唯一的端内解法。
      # 备料：scripts/prepare-vlckit.sh（只留 arm64 真机 slice）。
      - framework: build/vlckit/MobileVLCKit.framework
        embed: true
        codeSign: false
    # F 变体：静态链接 + -no_pie。
    # 依据：E 的 .ips 崩在 OpenJDK 的 logging 全局构造器（LogTagSet ->
    # MemTracker -> NativeCallStack），写入 __LINKEDIT 只读页 —— 典型的
    # 「非 PIC 静态对象被装进 PIE/dylib 后绝对地址失效」。固定基址（-no_pie）
    # 让链接期解出的绝对地址保持有效。
    settings:
      base:
        PRODUCT_NAME: Meow
        PRODUCT_BUNDLE_IDENTIFIER: com.meow.player.ios
        INFOPLIST_FILE: Meow/Info.plist
        SUPPORTED_PLATFORMS: iphoneos
        SDKROOT: iphoneos
        SWIFT_OBJC_BRIDGING_HEADER: Meow/Meow-Bridging-Header.h
        # 没有 AppIcon 时主屏/侧载器（LiveContainer 等）显示白块。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/build/jni/include"
          - "$(SRCROOT)/build/jni/include/ios"
          - "$(SRCROOT)/build/python/Python.framework/Headers"
        # F: 静态链 + 固定基址（-no_pie）
        # J: 把 __TEXT,__const 改到 __DATA,__const —— .ips 证明 NativeCallStack::EMPTY_STACK
        # 被放在只读的 __TEXT,__const 里，而它的构造函数要写这个对象（SIGBUS）。
        OTHER_LDFLAGS: "$(inherited) -Wl,-all_load $(SRCROOT)/build/libOpenJDK.a -Wl,-rename_section,__TEXT,__const,__DATA,__const -lc++ -lz -liconv -framework Foundation -framework UIKit -framework WebKit -framework Network -framework Security"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) MEOW_JVM_STATIC=1"
        # Xcode 默认 ENABLE_PIE=YES 会加 -pie，覆盖 OTHER_LDFLAGS 里的 -no_pie
        ENABLE_PIE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  # 模拟器包：只带 web 前端 + 静态文件服务；用 --api-base 连 macOS 上的
  # ApiServer 做 UI 验证与截图（真机包才内嵌 JVM）。
  MeowSim:
    type: application
    scheme:
      testTargets: []
    platform: iOS
    sources:
      - path: Meow
        excludes:
          - Info.plist
          # 模拟器包不带 CPython（framework 只有真机切片）；桥与调用在 Swift 侧
          # 用 targetEnvironment(simulator) 排除
          - MeowPython.c
      - path: build/web
        type: folder
        buildPhase: resources
      - path: build/config.sites.example.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MeowSim
        PRODUCT_BUNDLE_IDENTIFIER: com.meow.player.ios.sim
        INFOPLIST_FILE: Meow/Info.plist
        SUPPORTED_PLATFORMS: iphonesimulator
        SDKROOT: iphonesimulator
        SWIFT_OBJC_BRIDGING_HEADER: Meow/Meow-Bridging-Header.h
        # 没有 AppIcon 时主屏/侧载器（LiveContainer 等）显示白块。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -framework Foundation -framework UIKit -framework WebKit -framework Network -framework Security"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
